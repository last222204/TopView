/* ===== 말풍선 감정 템플릿 — 평소엔 normal, 필요할 때만 =====
   화남  : 가시 돋친 테두리·굵게·글자 떨림·빠르게 몰아침·낮고 거친 소리·쾅 튀어나옴 (빨강은 장판 전용이라 안 씀)
   차분  : 매끈·얇은 테두리·움직임 없음·느리고 일정·부드러운 소리·스르르
   당황  : 울렁이는 테두리·글자 제각각 들썩·빨랐다 멈췄다·높고 올라가는 소리·흔들리며 등장
   슬픔  : 아래로 처진 모양·꼬리 축 늘어짐·흐린 테두리·글자가 천천히 가라앉음·아주 느림·작고 떨어지는 소리·푸른 회색 바탕
   한 대사 안에서 감정이 바뀔 수 있다: emo=[['','panic'],['죽여','angry']] (그 글자부터 바뀜) */
const EMO={                                              // 크기·굵기는 작고 단정하게 — 감정은 모양과 움직임으로
  normal:{spd:1,    font:14,   wt:'600', bw:1.6, bg:'#f6f4f0', ink:'#20262e', fade:8},
  calm:  {spd:1.35, font:14,   wt:'500', bw:1.2, bg:'#f6f4f0', ink:'#2a313a', fade:3},
  angry: {spd:0.6,  font:15,   wt:'800', bw:2.2, bg:'#f6f4f0', ink:'#14181d', fade:14},
  panic: {spd:1,    font:14,   wt:'600', bw:1.6, bg:'#f6f4f0', ink:'#20262e', fade:8},
  sad:   {spd:2,    font:13.5, wt:'500', bw:1.2, bg:'#e2e6eb', ink:'#3d4855', fade:2.5}
};
const bFont=em=>{ const E2=EMO[em]; return E2.wt+' '+E2.font+'px '+langFont()+FS.ui; };
function emoSpec(text,spec){                              // 글자마다 감정
  const out=new Array(text.length).fill('normal'); if(!spec) return out;
  if(typeof spec==='string') return out.fill(spec);
  for(const [sub,em] of spec){ const i=sub?text.indexOf(sub):0; if(i>=0) for(let k=i;k<text.length;k++) out[k]=em; }
  return out;
}
function sayLine(c,text,spec){ c.line=text; c.emos=emoSpec(text,spec); c.typed=[]; c.shown=0; c.typeT=0; c.nextGap=-1; c.lastEmo=c.emos[0];
  c.bubble={a:0,cut:false,sep:0,fall:0,t0:c.rt}; }
function curEmo(c){ return c.emos?c.emos[Math.max(0,Math.min(c.emos.length-1,c.shown-1))]:'normal'; }
// 글자 찍기 — base:{cps,dot,space,bang}, voice:'boss'|'grunt'. 찍힌 글자마다 onChar(ch)
function typeTick(c,dt,base,voice,onChar){
  const b=c.bubble; b.a=Math.min(1,b.a+dt*EMO[c.emos[0]].fade);
  c.typeT+=dt;
  const gapOf=i=>{ const ch=c.line[i], em=c.emos[i], E2=EMO[em];
    let g=ch==='.'?base.dot:ch===' '?base.space:(ch==='!'&&base.bang)?base.bang:base.cps;
    g*=E2.spd; if(em==='panic') g*=Math.random()<0.25?2.4:0.7;          // 당황: 빨랐다 멈췄다
    return g; };
  while(c.shown<c.line.length){
    if(c.nextGap<0) c.nextGap=gapOf(c.shown);
    if(c.typeT<c.nextGap) break;
    c.typeT-=c.nextGap; c.nextGap=-1;
    const i=c.shown++, ch=c.line[i], em=c.emos[i];
    c.typed[i]=c.rt;
    if(em!==c.lastEmo){ c.lastEmo=em; if(em==='angry'){ S.shake=Math.max(S.shake,3); b.pop=c.rt; } }
    if(ch!==' '&&ch!=='.'&&ch!==','&&ch!=='—') sfx.vblip(c.shown,em,voice);
    if(onChar&&onChar(ch)===false) break;
  }
}
function rectWalk(bx,by,w,h,r,step,off){                 // 둥근 사각형 둘레를 따라 점을 찍는다 (off: 바깥으로 밀어낼 양)
  const pts=[], segs=[[bx+r,by,bx+w-r,by,0,-1],[bx+w,by+r,bx+w,by+h-r,1,0],[bx+w-r,by+h,bx+r,by+h,0,1],[bx,by+h-r,bx,by+r,-1,0]];
  const corner=(cx,cy,a0)=>{ for(let k=1;k<4;k++){ const a=a0+k/4*Math.PI/2; pts.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r,Math.cos(a),Math.sin(a)]); } };
  let n=0;
  segs.forEach((g,si)=>{ const L=Math.hypot(g[2]-g[0],g[3]-g[1]), m=Math.max(1,Math.round(L/step));
    for(let k=0;k<=m;k++){ const t=k/m; pts.push([g[0]+(g[2]-g[0])*t,g[1]+(g[3]-g[1])*t,g[4],g[5]]); }
    const cs=[[bx+w-r,by+r,-Math.PI/2],[bx+w-r,by+h-r,0],[bx+r,by+h-r,Math.PI/2],[bx+r,by+r,Math.PI]][si]; corner(cs[0],cs[1],cs[2]); });
  ctx.beginPath();
  pts.forEach((q,k)=>{ const o=off(k,pts.length); const x=q[0]+q[2]*o, y=q[1]+q[3]*o; k?ctx.lineTo(x,y):ctx.moveTo(x,y); });
  ctx.closePath();
}
function bubbleShape(bx,by,w,h,em,t){                     // 감정별 테두리 모양 (경로만)
  const r=7;
  if(em==='angry') rectWalk(bx-2,by-2,w+4,h+4,4,8,k=>k%2?5.5:0);                 // 촘촘하고 날카로운 가시
  else if(em==='panic') rectWalk(bx,by,w,h,r,6,(k,n)=>Math.sin(k/n*TAU*9+t*13)*1.3); // 잘게 울렁
  else if(em==='sad'){                                    // 아래가 살짝 처진다
    ctx.beginPath();
    ctx.moveTo(bx+r,by); ctx.lineTo(bx+w-r,by); ctx.quadraticCurveTo(bx+w,by,bx+w,by+r);
    ctx.lineTo(bx+w,by+h-r*0.7); ctx.quadraticCurveTo(bx+w*0.5,by+h+10,bx,by+h-r*0.7);
    ctx.lineTo(bx,by+r); ctx.quadraticCurveTo(bx,by,bx+r,by); ctx.closePath();
  }else rr(bx,by,w,h,r);
}
function cutSay(i){ const c=S.cut; c.li=i; sayLine(c,c.lines[i],c.emo?c.emo[i]:null); }
function updateCut(dt){
  cutTickPlayer(dt);
  if(S.cut.kind==='room'){ updateRoomCut(dt); return; }
  const c=S.cut, e=c.e, p=S.player;
  c.rt+=dt; c.st+=dt; S.rangeT=0;                     // 무기 범위 표시는 컷신에서 숨긴다
  let ts=1;
  // 레터박스
  const boxIn=(c.step!=='out'||c.onEnd)&&c.step!=='enter';   // 합본은 다음 장면까지 레터박스 유지
  c.box+=(boxIn?1:-1)*dt/0.35; c.box=clamp(c.box,0,1);

  if(c.step==='enter'){                                // 합본: 문으로 터벅터벅 들어와 멈춘다
    if(e.spawn>0) e.spawn=Math.max(0,e.spawn-dt);
    const dx=c.ex-p.x, dy=c.ey-p.y, L=Math.hypot(dx,dy);
    if(L>2){ const m=Math.min(L,78*dt); p.x+=dx/L*m; p.y+=dy/L*m; p.fx=dx/L; p.fy=dy/L;
      const b0=Math.floor(p.bob/Math.PI); p.bob+=dt*8; if(Math.floor(p.bob/Math.PI)!==b0) sfx.step(); p.idleT=0; }
    else{ p.fx=0; p.fy=-1; c.step='in'; c.st=0; }
    // 보이자마자 일제히 겨눈다 — 저마다 조금씩 늦게, 철컥
    for(const q of S.enemies){ if(q===e||q.dying) continue;
      if(c.st>0.2+(q.delay||0)*0.9&&!q.aimed){ q.aimed=true; q.eye=1; q.punch=0.3; if(Math.random()<0.3) sfx.aimClick(); } }
  }else if(c.step==='in'){
    if(e.spawn>0) e.spawn=Math.max(0,e.spawn-dt);
    if(c.st>=CUT.inT){ c.step='talk'; c.st=0; cutSay(0); }
  }else if(c.step==='talk'){
    const last=c.li===c.lines.length-1;
    typeTick(c,dt,{cps:CUT.cps,dot:CUT.dotT,space:CUT.spaceT},'boss',()=>{
      e.punch=0.25;                                         // 말할 때마다 몸이 살짝 들썩
      if(last&&c.shown>=c.stopAt){ c.step='wait2'; c.st=0; return false; }
    });
    if(c.step==='talk'&&!last&&c.shown>=c.line.length&&c.typeT>CUT.hold1){ c.st=0; cutSay(c.li+1); }   // 다 찍히면 읽을 시간 → 다음 대사
  }else if(c.step==='wait2'){
    if(c.st>=CUT.hold2){ c.step='draw'; c.st=0; p.armed=true; sfx.draw(1); }
  }else if(c.step==='draw'){
    p.draw=Math.min(1,c.st/CUT.drawT);
    if(c.st>=CUT.drawT){
      c.step='dash'; c.st=0; c.dashT=0;
      c.x0=p.x; c.y0=p.y;
      const ax=e.x-c.x0, ay=e.y-c.y0, L=Math.hypot(ax,ay);
      c.ang=Math.atan2(ay,ax);
      const over=L+115; c.x1=c.x0+ax/L*over; c.y1=c.y0+ay/L*over;   // 보스를 지나 뒤쪽까지
      p.restAng=c.ang-1.9; S.meleeOut=true;

  }else if(c.step==='dash'||c.step==='slow'){
    if(c.step==='slow'){ const k=Math.min(1,c.st/CUT.slowT); ts=lerp(CUT.slowTs0,CUT.slowTs1,Math.pow(k,0.8)); }

  if(c.step!=='dash'&&!(c.step==='slow'&&c.dashT<CUT.dashT)) p.idleT=(p.idleT||0)+dt*ts; else p.idleT=0;

  if(c.step==='slow'){
    // 보스가 그제야 당황한다

    if(c.st>0.35&&c.panicT<0){ c.panicT=0; }
    if(c.panicT>=0) c.panicT+=dt;
    if(c.bubble){ c.bubble.sep+=dt*7; }
    if(c.st>=CUT.slowT){ c.step='sheathe'; c.st=0; p.draw=0; S.meleeOut=false; }   // 칼은 그냥 사라진다 (집어넣는 동작·소리 없음)
  }else if(c.step==='sheathe'){
    if(c.bubble){ c.bubble.sep+=dt*7; }
    if(c.st>=CUT.sheatheT){
      c.step='split'; c.st=0; e.stun=0; e.glitch=0;
      e.dying=true; e.split=!c.blunt; e.cut=c.ang; e.ot=0;     // 블레이드는 두 동강, 후려치기는 찌그러져 터진다
      if(c.bubble) c.bubble.fall=0.001;
      music.cut(18000,0.4);
    }
  }else if(c.step==='split'){
    e.ot+=dt;
    if(c.bubble&&c.bubble.fall>0) c.bubble.fall+=dt;
    if(c.st>=CUT.splitT){
      bossFinale(e); e.dead=true;
      S.slow=0; S.msg=''; S.msgT=0; S.bossCam=null;

  }

  const d=dt*ts;
  S.t+=d;
  if(S.swing){ S.swing.t+=d; if(S.swing.t>S.swing.dur+0.12) S.swing=null; }   // 후려친 궤적 — 슬로우 속에선 공중에 멈춘 듯
  if(c.blunt&&c.hit&&!e.dying){ e.x+=e.kvx*d; e.y+=e.kvy*d; e.kvx*=Math.exp(-3*d); e.kvy*=Math.exp(-3*d); e.lean+=(e.kvx>0?1:-1)*d*0.8; }   // 밀려나며 기운다

  S.rings.length=0; S.parts.length=0;
  S.door={shut:0,closing:false};

}
function startComboPanic(){                              // 보스가 터진 직후 — 잡졸들이 그제야 정신을 차린다
  S.cut={kind:'room', step:'stare', st:0, rt:0, box:1, ts:1, victim:null, frozen:false, noKill:true};
  for(const e of S.enemies){ if(!e.dying){ e.seen=false; e.delay=Math.random()*0.3; } }
}
function roomFleeTarget(e,p){                            // 주인공 반대쪽 벽으로
  const ax=e.x-p.x, ay=e.y-p.y, L=Math.hypot(ax,ay)||1;
  return {x:clamp(e.x+ax/L*400+rnd(-80,80),BX0+20,BX1-20), y:clamp(e.y+ay/L*400+rnd(-60,60),BY0+20,BY1-120)};
}
function updateRoomCut(dt){
  const c=S.cut, p=S.player;
  c.rt+=dt; c.st+=dt; S.rangeT=0;
  p.squashT=Math.max(0,p.squashT-dt);                  // 멈출 때 눌림이 컷신 내내 굳어 있지 않게
  const boxOn=c.step!=='in'&&c.step!=='shut'&&!(c.step==='shout'&&c.shown>=c.line.length&&c.typeT>RC.hold-0.35);   // 외침 끝 무렵 걷히며 플레이로   // 들어올 때와 셔터가 닫힐 때는 문이 보여야 한다
  c.box=clamp(c.box+(boxOn?1:-1)*dt/0.35,0,1);
  let ts=1;
  if(c.step==='pre') ts=RC.preTs;
  else if(c.step==='post'){ const k=Math.min(1,c.st/RC.postT); ts=lerp(RC.postTs0,1,Math.pow(k,3)); }
  c.ts=ts;
  const d=dt*ts;
  const E=S.enemies.filter(e=>!e.dying&&e!==c.victim);
  // 주인공 걷기
  const walkTo=(tx,ty,sp)=>{ const dx=tx-p.x, dy=ty-p.y, L=Math.hypot(dx,dy);
    if(L>1){ const m=Math.min(L,sp*d); p.x+=dx/L*m; p.y+=dy/L*m; p.fx=dx/L; p.fy=dy/L;
      const b0=Math.floor(p.bob/Math.PI); p.bob+=d*8; if(Math.floor(p.bob/Math.PI)!==b0) sfx.step(); p.idleT=0; } else p.idleT+=d;   // 터벅터벅
    return L; };

  if(c.step==='in'){
    walkTo(DOOR.x,BY1-58,(H+24-(BY1-58))/RC.inT);
    for(const e of E){                                   // 아직 모른다 — 어슬렁
      if(Math.random()<d*0.6) e.aim+=rnd(-1,1);
    }
    if(c.st>=RC.inT){ c.step='notice'; c.st=0; }
  }else if(c.step==='stare'){
    // 상황 파악 — 겨누던 총구가 천천히 내려가고, 보스가 있던 자리를 멍하니 본다. 아직 아무도 안 떤다
    const B=S.comboBoss||{x:W/2,y:H/2};
    for(const e of E){ const a=Math.atan2(B.y-e.y,B.x-e.x); e.aim+=angDiff(a,e.aim)*Math.min(1,d*(1.2+(e.delay||0)*2)); e.eye=lerp(e.eye,0.3,Math.min(1,d*1.2)); e.stun=0; e.lean=0; }
    p.idleT+=d;
    if(c.st>=RC.stareT){ c.step='notice'; c.st=0; }
  }else if(c.step==='notice'){
    p.idleT+=d;
    for(const e of E){
      if(c.st>e.delay*0.8){ const a=Math.atan2(p.y-e.y,p.x-e.x); e.aim+=angDiff(a,e.aim)*Math.min(1,d*14);
        if(!e.seen){ e.seen=true; e.eye=1; e.punch=0.35; if(Math.random()<0.35) sfx.chatter(1.6); } }
      e.eye=Math.max(0.35,e.eye-d*1.5);
    }
    if(c.st>=RC.noticeT){ c.step='panic'; c.st=0;
      for(const e of E){ if(e.role==='flee'){ const t=roomFleeTarget(e,p); e.tx=t.x; e.ty=t.y; } }
      sfx.chatter(1); }
  }else if(c.step==='panic'||c.step==='walk'||c.step==='pre'||c.step==='slash'||c.step==='post'||c.step==='after'){
    if(c.step==='panic'&&c.st>=RC.panicT){
      if(c.noKill){ c.step='shut'; c.st=0; }
      else{
      // 가장 가까운 '떠는 놈' 하나를 고른다
      let best=null,bd=1e9; for(const e of E){ const q=Math.hypot(e.x-p.x,e.y-p.y)+(e.role==='shake'?0:60); if(q<bd){bd=q;best=e;} }
      c.victim=best; best.role='victim'; c.step='walk'; c.st=0;

    }
    if(c.step==='walk'){

      const L=walkTo(v.x,v.y,RC.walkSp);
      const a=Math.atan2(v.y-p.y,v.x-p.x); v.x+=Math.cos(a)*9*d; v.y+=Math.sin(a)*9*d; pushOut(v,v.r);   // 뒷걸음질 — 너무 늦다

        c.step='pre'; c.st=0; c.sAng=a;
        p.armed=true; p.draw=1; S.meleeOut=true; p.fx=Math.cos(a); p.fy=Math.sin(a);
        p.swingDir=-(p.swingDir||1); p.restAng=a-p.swingDir*1.9;     // 휘두를 반대쪽으로 당겨 둔다
        sfx.draw(1); sfx.preSlash(); music.cut(260,0.15);
        for(const e of E){ e.punch=0.2; }
      }
    }else if(c.step==='pre'){
      const v=c.victim; v.stun=1;
      if(c.st>=RC.preT){
        const w=meleeW(), a=c.sAng;
        c.step='slash'; c.st=0; c.hitDone=false;
        S.swing={t:0,dur:RC.slashT,ang:a,arc:2.7,range:w.range,dir:p.swingDir,blade:w.id==='blade',pipe:w.id==='pipe',heavy:false,bladeLen:w.range-6};
        p.restAng=null; p.kick=1.4; p.kang=a;

    }else if(c.step==='slash'||c.step==='post'){

      if(!c.hitDone&&c.st>=RC.slashT*0.45){
        // 팍 — 크게 터지고 크게 흔들린다. 그리고 다시 느려진다
        c.hitDone=true; c.frozen=true; c.step='post'; c.st=0;
        const blunt=meleeW().id!=='blade'; c.blunt=blunt;
        v.dying=true; v.split=!blunt; v.cut=c.sAng+Math.PI/2+(Math.random()-0.5)*0.3; v.ot=0;
        if(blunt){ v.kvx=Math.cos(c.sAng)*620; v.kvy=Math.sin(c.sAng)*620; v.spinV=(Math.random()<0.5?-1:1)*7; v.punch=1; }   // 후려쳐 날려 버린다
        else S.slashes.push({x:v.x,y:v.y,a:v.cut,t:0,len:v.s*4.2,big:true});
        PSCALE=1.8; try{ fountain(v.x,v.y,40,300,520); sparks(v.x,v.y,c.sAng,44,700,1.3); sparks(v.x,v.y,0,20,420,TAU); } finally{ PSCALE=1; }
        ringfx(v.x,v.y,8,v.s*3.2,6,'rgba(255,255,255,',0.4); ringfx(v.x,v.y,4,v.s*2.2,3,'rgba('+CYAN_RGB+',',0.5);
        S.flashW=Math.max(S.flashW,0.32); S.shake=Math.max(S.shake,13); S.camP=Math.max(S.camP,0.09); hitStop(0.1);
        if(blunt){ sfx.pipeHit(1.6,true); sfx.heavy(1.0); ringfx(v.x,v.y,6,v.s*2.4,5,'rgba(255,196,70,',0.4); } else { sfx.cut(1.5); sfx.clang(1.1); sfx.heavy(0.9); }
        for(const e of E){ e.kvx+=(e.x-p.x)>0?90:-90; e.kvy+=(e.y-p.y)>0?50:-50; e.punch=0.6; e.stun=1; }   // 다른 놈들이 움찔 — 뒤로 밀린다
      }
      if(c.hitDone){ v.ot=Math.min(0.28,v.ot+d*0.9);
        if(c.blunt){ v.x+=v.kvx*d; v.y+=v.kvy*d; v.lean=(v.lean||0)+v.spinV*d; pushOut(v,v.r);   // 공중에서 빙글 돌며 날아간다
          if(Math.random()<d*40) sparks(v.x,v.y,Math.random()*TAU,3,260,1.2); } }
      if(S.swing&&S.swing.t>=S.swing.dur+0.05){ p.restAng=S.swing.ang+S.swing.arc/2*S.swing.dir; S.swing=null; }
      if(c.step==='post'&&c.st>=RC.postT){
        // 원래 속도로 풀리는 순간 터진다
        explode(v); v.dead=true; S.shake=Math.max(S.shake,10); S.flashW=Math.max(S.flashW,0.2); sfx.boom(1.1,false);
        if(S.swing){ p.restAng=S.swing.ang+S.swing.arc/2*S.swing.dir; S.swing=null; }

      }
    }else if(c.step==='after'){
      p.idleT+=d;
      if(c.st>=RC.afterT){ c.step='shut'; c.st=0; }
    }
    // 잡졸들 — 역할대로
    for(const e of E){
      if(e.role==='flee') e.bob+=d*14;               // 뛰는 놈만 발이 움직인다
      if(c.frozen){ e.stun=1; e.x+=e.kvx*d; e.y+=e.kvy*d; e.kvx*=0.9; e.kvy*=0.9; pushOut(e,e.r); if(e.sweat<0&&Math.random()<d*0.6) e.sweat=0; continue; }
      if(e.role==='flee'){
        const dx=e.tx-e.x, dy=e.ty-e.y, L=Math.hypot(dx,dy);
        if(L>8){ const sp=165+Math.sin(e.bob*0.7)*40; e.x+=dx/L*sp*d+rnd(-1,1)*40*d; e.y+=dy/L*sp*d+rnd(-1,1)*40*d; e.aim=Math.atan2(dy,dx); }
        else{ e.stun=1; if(Math.random()<d*1.5){ const t=roomFleeTarget(e,p); e.tx=clamp(t.x+rnd(-90,90),BX0+20,BX1-20); e.ty=t.y; } }   // 막혔다 — 다른 데로
        if(Math.random()<d*0.5) e.aim+=rnd(-2,2);           // 두리번
        if(Math.random()<d*0.4) sfx.chatter(1.1+Math.random()*0.6);
      }else{                                              // 떠는 놈 — 덜덜 떨며 뒷걸음질
        const a=Math.atan2(e.y-p.y,e.x-p.x); e.x+=Math.cos(a)*18*d; e.y+=Math.sin(a)*18*d;
        e.aim=a+Math.PI; e.stun=1; if(e.sweat<0&&Math.random()<d*0.8) e.sweat=0;
      }
      pushOut(e,e.r);
    }
    separateEnemies();
  }else if(c.step==='shut'){
    for(const e of E){ e.stun=1; pushOut(e,e.r); }
    if(c.st>=0.4) S.door.closing=true;                    // 카메라가 문을 비춘 뒤에 쾅
    if(c.st>=RC.shutT){                                   // 가장 가까운 놈이 더듬으며 외친다
      let best=null,bd=1e9; for(const e of E){ const q=Math.hypot(e.x-p.x,e.y-p.y); if(q<bd&&q>60){bd=q;best=e;} }
      c.speaker=best||E[0]; c.step='shout'; c.st=0;
      c.lines=[t('cut.r1')]; c.li=0; c.hit=false; sayLine(c,c.lines[0],[['','panic'],['죽여','angry']]);   // 더듬다가(당황) "죽여!!"에서 화남
    }
  }else if(c.step==='shout'){
    const sp=c.speaker, b=c.bubble; b.a=Math.min(1,b.a+dt*8);
    for(const e of E){ e.stun=1; pushOut(e,e.r); }
    sp.aim=Math.atan2(p.y-sp.y,p.x-sp.x);
    // 한 놈이 떨면서 무리 앞으로 몇 걸음 나선다 (말풍선이 화면 안에 들어오게)
    const dxs=p.x-sp.x, dys=p.y-sp.y, Ls=Math.hypot(dxs,dys);
    if((Ls>190||sp.y<230)&&Ls>150&&c.st<0.9){ sp.x+=dxs/Ls*150*dt; sp.y+=Math.max(dys/Ls*150,sp.y<230?160:0)*dt; sp.bob+=dt*14; }
    if(c.st<0.6){ b.a=0; b.t0=c.rt; }
    else typeTick(c,dt,{cps:0.06,dot:0.16,space:0.03,bang:0.05},'grunt',ch=>{
      sp.punch=0.3;
      if(ch==='!'){ S.shake=Math.max(S.shake,2); for(const e of E){ e.eye=1; } }   // 외침에 눈빛이 일제히 켜진다
    });
    if(c.shown>=c.line.length&&c.typeT>RC.hold){ c.step='out'; c.st=0; }
  }else if(c.step==='out'){
    endRoomCut(); return;
  }
  p.kick=Math.max(0,(p.kick||0)-dt*7);                  // 휘두른 반동은 금방 제자리로
  if(p.trail.length){ c.trT=(c.trT||0)+dt; if(c.trT>0.035){ c.trT=0; p.trail.shift(); } }
  // 셔터
  const D=S.door;
  if(D.closing&&D.shut<1){ D.shut=Math.min(1,D.shut+dt/0.12);
    if(D.shut>=1){ sfx.slam(1.1); S.shake=Math.max(S.shake,8); ringfx(DOOR.x,BY1,4,90,4,'rgba(255,255,255,',0.25); dust(DOOR.x,BY1-6,14,180);
      for(const e of S.enemies){ if(!e.dying){ e.punch=0.5; } } } }
  // 식은땀
  for(const e of S.enemies) if(e.sweat>=0) e.sweat+=dt;
  // 세계
  S.t+=d;
  for(const e of S.enemies){ if(e.dying) continue;
    const scared=c.step!=='in'&&c.step!=='notice'&&c.step!=='stare'&&(e.role==='shake'||e.role==='victim'||c.frozen||e.stun>0.5);
    e.lean=scared?Math.sin(c.rt*46+e.bob)*0.09:lerp(e.lean||0,0,Math.min(1,dt*8));
    if(scared&&c.step!=='notice') e.eye=0.15+Math.random()*0.2; }        // 눈빛이 꺼질 듯 흔들린다
  for(const e of S.enemies){ if(e.punch>0) e.punch=Math.max(0,e.punch-dt*3); if(e.flash>0) e.flash-=d; if(e.stun>0&&c.step!=='shut') e.stun=Math.max(0,e.stun-dt*0.2); if(e.glitch>0) e.glitch=Math.max(0,e.glitch-dt); }
  updateParts(d); updateDebris(d);
  for(const q of S.slashes) q.t+=d; S.slashes=S.slashes.filter(q=>q.t<(q.big?0.2:0.13));
  compact(S.enemies,q=>!q.dead);
  // 카메라 — 카메라는 초점 둘레로 확대되므로, 문 장면은 아래 벽 가운데를 초점으로
  const vv=c.victim, mx=vv?(p.x+vv.x)/2:p.x, my=vv?(p.y+vv.y)/2:p.y;   // 주인공과 베일 놈 사이
  const cam={stare:[W/2,H/2,0.08,1.2], in:[W/2,H,0.32,2.4], notice:[W/2,H*0.8,0.14,1.6], panic:[W/2,H/2,0.06,1.4], walk:[p.x,p.y,0.32,1.4],
    pre:[mx,my,0.75,3], slash:[mx,my,0.8,6], post:[mx,my,0.85,2], after:[p.x,p.y,0.5,1.2], shut:[W/2,H,0.45,6], shout:[c.speaker?c.speaker.x:p.x,c.speaker?c.speaker.y-30:p.y,0.32,3]}[c.step];
  if(cam) camTo(cam[0],cam[1],cam[2],cam[3],dt);

function endRoomCut(){

function drawDoor(){

    ctx.fillStyle='#c9a13a'; ctx.fillRect(x0-3,y0,DOOR.w+6,2.5);          // 경고 띠
  }
}
function drawRoomCutWorld(){
  // 식은땀
  for(const e of S.enemies){
    if(e.sweat<0||e.dying) continue;
    const sk=(e.sweat%1.4)/1.4, sx=e.x+e.s*0.5, sy=e.y-e.s*0.35+sk*12, a=sk<0.85?1:1-(sk-0.85)/0.15;
    ctx.globalAlpha=a; ctx.fillStyle='#bfe6f7'; ctx.strokeStyle=INK; ctx.lineWidth=1.2;
    ctx.beginPath(); ctx.moveTo(sx,sy-5); ctx.quadraticCurveTo(sx+3.6,sy,sx,sy+3); ctx.quadraticCurveTo(sx-3.6,sy,sx,sy-5); ctx.fill(); ctx.stroke();
    ctx.globalAlpha=1;
  }
  const c=S.cut; if(c&&c.step==='shout'&&c.speaker&&c.bubble) drawBubble(c,c.speaker,c.bubble);   // 말풍선은 식은땀보다 위에

function tutSay(who,text,voice,hold){

// 카메라 — 긴 로비라 '화면 가운데에 둘 지점'과 확대만 정하고, 엔진의 초점 값은 거기서 거꾸로 계산한다
function tutCamApply(){
  const cm=S.tut.cam, z=1+cm.z;
  const hx=W/(2*z), hy=H/(2*z);
  const cx=clamp(cm.x,hx,W-hx), cy=clamp(cm.y,hy,AREA[S.tut.area].h-hy);
  S.camZ=cm.z;
  const zz=1+S.camZ+S.camP;
  S.focus.x=(W/2-cx*zz)/(1-zz); S.focus.y=(H/2-cy*zz)/(1-zz);
}
function tutCamTo(x,y,z,sp,dt){ const cm=S.tut.cam, k=Math.min(1,dt*sp);
  cm.x=lerp(cm.x,x,k); cm.y=lerp(cm.y,y,k); cm.z=lerp(cm.z,z,Math.min(1,dt*sp*0.8)); tutCamApply(); }

/* ----- 매 프레임 ----- */
function updateTut(dt){
  const u=S.tut, p=S.player;
  u.t+=dt; u.rt+=dt; S.t+=dt;
  u.fin=Math.max(0,u.fin-dt*1.4);
  if(!u.combat&&!u.riot) music.want=1;
  tickTimers(dt,dt);
  // 말풍선
  for(const q of u.talks){ const c=q.c; c.rt+=dt;
    if(c.shown<c.line.length) typeTick(c,dt,{cps:0.055,dot:0.14,space:0.03,bang:0.06},c.voice);
    if(!c.out){ c.bubble.a=Math.min(1,c.bubble.a+dt*EMO[c.emos[0]].fade);   // 짧은 줄(헤헤)도 끝까지 또렷해지게
      if(c.shown>=c.line.length){ c.hold-=dt; if(c.hold<=0) c.out=true; } }
    else c.bubble.a-=dt*4; }
  u.talks=u.talks.filter(q=>!(q.c.out&&q.c.bubble.a<=0));
  const sis=u.sis;
  if(u.area==='lobby'&&!u.riot){
    // 안내 로봇 — 늘 주인공 쪽을 본다 (나중을 위한 복선)
    const cl=u.clerk; cl.aim=Math.atan2(p.y-cl.y,p.x-cl.x); cl.punch=Math.max(0,cl.punch-dt*3);
    if(!u.greeted&&u.stage==='move'&&u.t>0.5){ u.greeted=true; cl.punch=0.6; tutSay(cl,t('tut.clerk'),'grunt',1.0); }   // 들어서면 인사한다
    if(sis.hop>=0){ sis.hop+=dt*3.2; if(sis.hop>=1) sis.hop=-1; }
    if(u.stage!=='meet'&&!sis.gone){ sis.idle+=dt; if(sis.idle>2.6){ sis.idle=0; sis.hop=0; } }   // 기다리며 발끝으로 콩
  }
  if(u.area==='lobby'&&!u.riot) for(const q of u.people){ q.ph+=dt; q.lookX=Math.sin(q.ph*0.7)>0.6?1:Math.sin(q.ph*0.7)<-0.6?-1:0; }
  if(u.area==='cafe'&&!u.riot&&u.stage!=='riot'){ for(const k of ['s1','s2']){ const r=u.bots[k], P=r.path; r.ph=(r.ph||0)+dt*0.25;   // 서빙 로봇은 천천히 오간다
      const k2=(Math.sin(r.ph*Math.PI)+1)/2; r.x=lerp(P[0][0],P[1][0],k2); r.y=lerp(P[0][1],P[1][1],k2); r.bob+=dt*6; r.aim=Math.cos(r.ph*Math.PI)>0?0:Math.PI; } }
  const moving=tutTransit(dt);                        // 방 옮기는 중엔 멈춘다

  if(u.stage==='enter'){                              // 자동문이 열리고 걸어 들어온다
    if(u.t<0.05) sfx.autoDoor();
    u.door=Math.min(1,u.t/0.5);
    if(u.t>0.35){ p.y=Math.max(LB.H-110,p.y-120*dt); p.bob+=dt*12; p.idleT=0; }
    if(p.y<=LB.H-110){ u.stage='move'; u.t=0; }
  }else if(u.stage==='meet'){
    tutMeet(dt);
  }else if(!TUT_LOCK[u.stage]&&!moving){
    const ox=p.x, oy=p.y;
    updatePlayer(dt,dt);
    u.moved+=Math.hypot(p.x-ox,p.y-oy);
    if(p.dash&&!u.dashed){ u.dashed=true; }
    if(u.door>0) u.door=Math.max(0,u.door-dt*1.6);
    tutDoors();
  }
  // F로 할 것 — 여동생(대화) 또는 이야기 속 물건
  u.near=u.area==='lobby'&&!sis.gone&&!u.riot&&u.stage!=='meet'&&!TUT_LOCK[u.stage]&&Math.hypot(p.x-sis.x,p.y-sis.y)<110;
  u.fA=lerp(u.fA||0,u.near?1:0,Math.min(1,dt*10));
  const it=TUT_LOCK[u.stage]?null:tutInterFind();
  if(it) u.inter=it; u.iA=lerp(u.iA||0,it?1:0,Math.min(1,dt*10)); if(!it&&u.iA<0.02) u.inter=null;
  if(u.stage!=='meet'&&u.wcDoor>0.001) u.wcDoor=lerp(u.wcDoor,0,Math.min(1,dt*9));
  // 게이트 — 반란 전엔 가까이 오면 저절로 열리고, 반란 뒤엔 잠겨 있다
  if(u.area==='lobby'){
    const near=!u.riot&&Math.abs(p.y-LB.gy)<110&&p.x>LB.ped[0]-50&&p.x<LB.ped[3]+50;
    if(near&&!u.gOpen){ u.gOpen=true; sfx.gateOpen(); }
    else if((!near&&u.gOpen&&Math.abs(p.y-LB.gy)>140)||u.riot) u.gOpen=false;
    u.fl=lerp(u.fl,u.gOpen?0:1,Math.min(1,dt*12));
  }
  tutStory(dt);
  if(!S.tut) return;
  updateParts(dt);
  // 카메라 — 평소엔 주인공을 따라가고, 컷신에선 정해진 곳을 본다
  if(u.camDirect){ Object.assign(u.cam,u.camDirect); tutCamApply(); }
  else if(u.ribCam){ const T=u.ribCam; tutCamTo(T.x,T.y,T.z,1.6,dt); }      // 리본 컷신 — 천천히
  else if(u.stage==='meet'&&!sis.gone){ const T=u.camT||MEET_CAM.home; tutCamTo(T.x,T.y,T.z,2.2,dt); }   // 대화: 엘리베이터 벽까지 보이게, 줄에 따라 카페·주변으로
  else if(u.stage==='sit'||u.stage==='riot'||u.stage==='miniIntro'){ const T=u.riotCam||{x:400+XO,y:260,z:0.3}; tutCamTo(T.x,T.y,T.z,u.camSlow?1.3:u.riotCam?5:2.2,dt); }   // 반란 컷신 카메라
  else tutCamTo(p.x,p.y-18,u.area==='lobby'?0.35:0.28,3,dt);
}
function tutInteract(){                              // F — 지금 가까이 있는 중요한 것과 상호작용
  const u=S.tut, p=S.player;
  if(u.inter&&u.iA>0.3&&!TUT_LOCK[u.stage]){ const fn=u.inter.fn; u.inter=null; u.iA=0; fn(); return; }
  if(u.near&&u.stage!=='meet'){ u.stage='meet'; u.mt=0; u.near=false; u.fA=0; p.dash=null; p.kvx=p.kvy=0; p.squashT=0; sfx.blip(3);
    u.sc=-1; u.wait='go'; u.wt=0.35; u.choice=null; u.camT=null; u.talk=null; u.leaving=false; }
}
/* 만남 대본 — 한 줄씩, 다 읽으면 F·Space·Enter·클릭으로 넘긴다. 칠 때 누르면 그 줄을 바로 다 보여 준다
   face: 여동생 표정 / emo: 말풍선 감정 / cam: 그 줄 동안 카메라가 볼 곳 */
const MEET=[
  {say:'tut.s1', face:'smile', hop:true},
  {say:'tut.s2', face:'smile'},
  {say:'tut.s2b', face:'smile'},
  {say:'tut.s3', face:'shy', emo:'calm'},
  {choice:['tut.c1','tut.c2']},
  {say:'tut.s4', face:'soft', emo:'calm'},
  {say:'tut.s4b', face:'soft', emo:'calm'},
  {say:'tut.s5', face:'dot', hop:true, cam:'cafe', point:-1},
  {say:'tut.s6', face:'smile'},
  {say:'tut.s7', face:'smile', hop:true},
  {leave:true}
];
const MEET_CAM={home:{x:W/2,y:0,z:0.42}, cafe:{x:200,y:262,z:0.3}, left:{x:120,y:170,z:0.6}, right:{x:780+XR,y:170,z:0.6}};
function meetNext(){                                  // 다음 대본으로
  const u=S.tut, sis=u.sis;
  if(u.talk){ u.talk.out=true; u.talk.hold=0; }
  u.sc++; const st=MEET[u.sc]; if(!st) return;
  u.camT=st.cam?MEET_CAM[st.cam]:null;
  sis.point=st.point||0;
  if(st.face) sis.face=st.face;
  if(st.hop) sis.hop=0;
  if(st.say){ u.talk=tutSay(sis,t(st.say),'sis',1e9); u.talk.more=true; if(st.emo) sayLine(u.talk,u.talk.line,st.emo); u.wait='read'; }
  else if(st.choice){ u.talk=null; u.choice={opts:st.choice,sel:0,a:0}; u.wait='choice'; }
  else if(st.leave){ u.talk=null; u.leaving=true; u.wait='none'; }
}
function meetAdvance(){                               // 넘기기 (말이 아직 찍히는 중이면 다 보여 주기)
  const u=S.tut; if(u.stage!=='meet') return;
  if(u.wait==='read'&&u.talk){
    const c=u.talk;
    if(c.shown<c.line.length){ for(let i=c.shown;i<c.line.length;i++) c.typed[i]=c.rt; c.shown=c.line.length; return; }
    sfx.blip(1); meetNext();
  }else if(u.wait==='choice') meetPick(u.choice.sel);
}
function meetPick(i){                                 // 선택지 고르기 — 1. 끄덕인다 / 2. 둘러본다
  const u=S.tut; if(u.wait!=='choice') return;
  u.choice.sel=i; u.choice.done=true; sfx.gateOpen();
  u.wait='act'; u.act=i===0?'nod':'look'; u.at=0;
}
function tutKey(k){                                   // 대화 중 키 — 쓴 키면 true (이동·대쉬로 새지 않게 전부 먹는다)
  const u=S.tut; if(!u||u.stage!=='meet') return false;
  if(u.wait==='choice'){
    if(k==='arrowup'||k==='w') u.choice.sel=0;
    else if(k==='arrowdown'||k==='s') u.choice.sel=1;
    else if(k==='1') meetPick(0); else if(k==='2') meetPick(1);
    else if(k==='enter'||k===' '||k==='f') meetPick(u.choice.sel);
    if(k==='arrowup'||k==='w'||k==='arrowdown'||k==='s') sfx.blip(2);
  }else if(k==='enter'||k===' '||k==='f') meetAdvance();
  return true;
}
function tutPointer(q){                               // 대화 중 클릭·터치
  const u=S.tut; if(!u||u.stage!=='meet') return false;
  if(u.wait==='choice'){ const r=choiceRects(); for(let i=0;i<r.length;i++){ const b=r[i];
      if(q.x>b.x&&q.x<b.x+b.w&&q.y>b.y&&q.y<b.y+b.h){ meetPick(i); return true; } } return true; }
  meetAdvance(); return true;
}
function tutMeet(dt){
  const u=S.tut, p=S.player, sis=u.sis; u.mt+=dt;
  u.lb=Math.min(1,u.lb+dt*2.5);
  p.idleT=(p.idleT||0)+dt; p.lean=lerp(p.lean,0,Math.min(1,dt*8));
  p.squashT=0; p.nod=Math.max(0,(p.nod||0)-dt);
  if(p.trail.length) p.trail.shift();
  if(u.wait==='go'){ u.wt-=dt; if(u.wt<=0) meetNext(); }
  if(u.choice){ u.choice.a=Math.min(1,u.choice.a+dt*(u.choice.done?-5:6)); if(u.choice.done&&u.choice.a<=0) u.choice=null; }
  // 여동생 몸짓 — 쑥스러우면 좌우로 살랑, 가리키면 그쪽으로 기운다
  sis.sway=sis.face==='shy'?Math.sin(u.mt*5)*0.12:0;
  if(!u.leaving) sis.lean=lerp(sis.lean,(sis.point||0)*0.2+sis.sway,Math.min(1,dt*8));
  // 선택한 행동
  p.lookX=lerp(p.lookX||0,0,Math.min(1,dt*6));
  if(u.wait==='act'){
    u.at+=dt; const a=u.at;
    if(u.act==='nod'){
      if(a-dt<=0.05&&a>0.05) p.nod=0.24; if(a-dt<=0.36&&a>0.36) p.nod=0.24;
      if(a>0.95) meetNext();
    }else{                                            // 둘러본다 — 지나온 길을 한 번 훑는다: 커피숍을 스치고 → 게이트 → 정문 쪽 → 다시 여동생
      const D=LOOK_T, k=Math.min(1,a/D), e=k*k*(3-2*k);
      u.camDirect=lookPath(e);
      p.lookX=clamp((u.camDirect.x-W/2)/200,-1,1);
      if(a>=D){ u.camDirect=null; meetNext(); }
    }
  }
  // 화장실 문 — 여동생이 다가가면 열리고, 들어가고 나면 닫힌다
  const wcNear=u.leaving&&!sis.gone&&Math.hypot(sis.x-LB.wc.x,sis.y-LB.top)<90;
  if(wcNear&&!u.wcOpen){ u.wcOpen=true; sfx.autoDoor(); }
  if(sis.gone){ u.wcShut=(u.wcShut||0)+dt; if(u.wcShut>0.35) u.wcOpen=false; }
  u.wcDoor=lerp(u.wcDoor||0,u.wcOpen?1:0,Math.min(1,dt*9));
  if(u.leaving&&!sis.gone){                          // 화장실 문으로 총총 — 문 앞까지 가서 쏙 들어간다
    if(OBST.some(o=>o.sis)) OBST=OBST.filter(o=>!o.sis);
    sis.leftObst=true;
    sis.face='dot'; sis.point=0;
    const atDoor=Math.abs(sis.x-LB.wc.x)<3;
    const tx=LB.wc.x, ty=atDoor?LB.top-6:LB.top+40, dx=tx-sis.x, dy=ty-sis.y, L=Math.hypot(dx,dy);
    const sp=250*dt;
    if(L>sp){ sis.x+=dx/L*sp; sis.y+=dy/L*sp; sis.bob+=dt*16; sis.lean=lerp(sis.lean,(dx/(L||1))*0.14,Math.min(1,dt*9)); }
    else{ sis.x=tx; sis.y=ty; }
    if(sis.y<LB.top+16) sis.alpha=Math.max(0,sis.alpha-dt*5);
    if(sis.alpha<=0) sis.gone=true;
  }
  if(sis.gone&&(u.wcShut||0)>0.6){ u.lb=Math.max(0,u.lb-dt*5); if(u.lb<=0) u.stage='cafe'; }
}
const LOOK_T=4.0;
const LOOK_PTS=[[W/2,211,0.42],[230,330,0.34],[W/2,540,0.3],[W/2,760,0.3],[W/2,211,0.42]];   // 여동생 → 커피숍 → 게이트 → 아래 로비 → 여동생
function lookPath(e){                                 // 점들을 부드럽게 잇는 곡선 (멈칫 없이 한 번에 훑는다)
  const P=LOOK_PTS, n=P.length-1, f=e*n, i=Math.min(n-1,Math.floor(f)), t=f-i;
  const g=j=>P[Math.max(0,Math.min(n,j))];
  const cr=(a,b,c,d)=>0.5*((2*b)+(-a+c)*t+(2*a-5*b+4*c-d)*t*t+(-a+3*b-3*c+d)*t*t*t);
  const p0=g(i-1),p1=g(i),p2=g(i+1),p3=g(i+2);
  return {x:cr(p0[0],p1[0],p2[0],p3[0]), y:cr(p0[1],p1[1],p2[1],p3[1]), z:cr(p0[2],p1[2],p2[2],p3[2])};
}
function choiceRects(){                               // 선택지 두 칸 (화면 좌표) — 아래 레터박스 바로 위, 가운데
  const w=250,h=34,g=8,x=W/2-w/2,y0=H-H*0.1-14-(h*2+g);
  return [{x,y:y0,w,h},{x,y:y0+h+g,w,h}];
}
function drawTutChoice(){
  const u=S.tut, ch=u.choice; if(!ch) return;
  const R=choiceRects(), a=ch.a;
  ctx.save(); ctx.globalAlpha=a;
  R.forEach((b,i)=>{
    const sel=i===ch.sel, y=b.y+(1-a)*8;
    ctx.fillStyle='rgba(8,10,14,0.28)'; rr(b.x,y+3,b.w,b.h,7); ctx.fill();
    ctx.fillStyle=sel?'#f6f4f0':'rgba(246,244,240,0.82)'; rr(b.x,y,b.w,b.h,7); ctx.fill();
    ctx.strokeStyle=sel?'rgba(18,22,28,0.92)':'rgba(18,22,28,0.35)'; ctx.lineWidth=sel?1.8:1.2; rr(b.x,y,b.w,b.h,7); ctx.stroke();
    if(sel){ ctx.fillStyle=CYAN; rr(b.x+8,y+9,3,b.h-18,1.5); ctx.fill(); }
    ctx.fillStyle=sel?'#2a323c':'#8a929b'; rr(b.x+18,y+8,18,18,4); ctx.fill();
    ctx.fillStyle='#f6f4f0'; ctx.font='800 11px '+FS.ui; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(String(i+1),b.x+27,y+17.5);
    ctx.fillStyle=sel?'#20262e':'#5a636c'; ctx.font='600 14px '+langFont()+FS.ui; ctx.textAlign='left';
    ctx.fillText(t(ch.opts[i]),b.x+46,y+17.5);
  });
  ctx.restore();
}

function drawTutOver(){                              // 인물 위 · 말풍선 · 키 안내
  const u=S.tut, p=S.player;
  if(u.area==='lobby'&&!u.clerkGone&&u.clerk.y>p.y) drawRobot(u.clerk);
  if(u.area==='lobby'&&!u.sis.gone&&u.sis.y>p.y) drawSisterA(u.sis);
  if(u.area==='lobby'&&!u.riot) for(const q of u.people) if(q.y>p.y) drawHuman(q);
  drawTut2Over();
  for(const q of u.talks) if(q.c.bubble&&q.c.bubble.a>0) drawBubble(q.c,q.who,q.c.bubble);
  if(u.fA>0.02&&!u.sis.gone&&u.stage!=='meet') drawFKey(u.sis.x,u.sis.y-u.sis.s*0.5-14,u.fA,t('tut.talk'));
  // 키 안내 — 주인공 머리 위에 작게. 해 보면 사라진다
  const ax=p.x, ay=p.y-p.s*0.5-16;
  const showMove=u.stage==='move'&&u.moved<90&&u.t>0.25;
  if(showMove){
    const a=Math.min(1,(u.t-0.25)*3)*(1-Math.max(0,(u.moved-60)/30));
    ctx.save(); ctx.globalAlpha=a;
    if(MOBILE) tutLabel(ax,ay-8,t('tut.drag'));
    else{ keycap(ax,ay-30,'W',18); keycap(ax-20,ay-10,'A',18); keycap(ax,ay-10,'S',18); keycap(ax+20,ay-10,'D',18); tutLabel(ax,ay+10,t('tut.move')); }
    ctx.restore();
  }else if(u.stage==='move'&&u.moved>=90){            // 다 걸었으면 대쉬 — 한 번 써 보면 사라진다
    if(u.dashed) u.dashT=Math.min(1,u.dashT+0.05); else u.dashT=Math.max(-1,u.dashT-0.06);
    const a=u.dashed?Math.max(0,1-u.dashT*2):Math.min(1,-u.dashT);
    if(a>0){
      ctx.save(); ctx.globalAlpha=a;
      if(MOBILE) tutLabel(ax,ay-8,t('tut.dashM'));
      else{ keycap(ax,ay-26,'SPACE',58); tutLabel(ax,ay-7,t('tut.dash')); }
      ctx.restore();
    }
  }
}

function drawSister(o){                              // 여동생 — 주인공과 같은 네모 몸, 따뜻한 색, 리본
  const s=o.s, hw=s/2, hop=o.hop>=0?Math.sin(o.hop*Math.PI)*7:0;
  ctx.fillStyle='rgba(28,38,50,0.2)';
  ctx.beginPath(); ctx.ellipse(o.x+2,o.y+4,hw*0.95*(1-hop/30),hw*0.85*(1-hop/30),0,0,TAU); ctx.fill();
  ctx.save(); ctx.translate(o.x,o.y-hop+Math.sin(o.bob)*1.2); ctx.rotate(o.lean);
  const foot=Math.sin(o.bob)*2.2;
  ctx.fillStyle=SIS.foot; ctx.strokeStyle=INK; ctx.lineWidth=LINE_THIN; ctx.lineJoin='round';
  rr(-hw*0.6,hw-3+foot,s*0.26,5.5,2); ctx.fill(); ctx.stroke();
  rr(hw*0.6-s*0.26,hw-3-foot,s*0.26,5.5,2); ctx.fill(); ctx.stroke();
  ctx.translate(0,Math.sin(S.t*2.6+1)*1);
  ctx.fillStyle=SIS.body; rr(-hw,-hw,s,s,s*0.34); ctx.fill();
  ctx.strokeStyle=INK; ctx.lineWidth=LINE_CHAR; rr(-hw,-hw,s,s,s*0.34); ctx.stroke();
  // 리본 (오른쪽 위) — 나중에 반쯤 타 버린 채 발견될 그 리본
  ctx.save(); ctx.translate(hw*0.78,-hw*0.62); ctx.rotate(0.85);
  ctx.fillStyle=SIS.ribbon; ctx.strokeStyle=INK; ctx.lineWidth=1.2; ctx.lineJoin='round';
  for(const sd of [-1,1]){ ctx.beginPath(); ctx.moveTo(0,0); ctx.bezierCurveTo(sd*4,-8,sd*11,-5,sd*9,0); ctx.bezierCurveTo(sd*11,5,sd*4,7,0,0); ctx.fill(); ctx.stroke(); }   // 고리
  ctx.fillStyle=SIS.ribbonD; ctx.beginPath(); ctx.ellipse(0,0,2.6,3.2,0,0,TAU); ctx.fill(); ctx.stroke();
  ctx.restore();
  // 얼굴
  const ink='#1c232c', ey=-hw*0.06, ew=Math.max(2.3,s*0.09);
  ctx.strokeStyle=ink; ctx.fillStyle=ink; ctx.lineCap='round'; ctx.lineWidth=1.8;
  if(o.face==='shy'){                                 // 헤헤 — 눈웃음 + 볼이 더 빨갛게 + 입은 작게
    for(const sg of [-1,1]){ ctx.beginPath(); ctx.arc(sg*hw*0.4,ey+ew*0.9,ew*0.75,Math.PI*1.15,Math.PI*1.85); ctx.stroke(); }
    ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(0,hw*0.28,s*0.05,0.1*Math.PI,0.9*Math.PI); ctx.stroke();
    ctx.fillStyle='rgba(230,120,140,0.55)'; ctx.beginPath(); ctx.ellipse(-hw*0.6,hw*0.22,4,2.6,0,0,TAU); ctx.ellipse(hw*0.6,hw*0.22,4,2.6,0,0,TAU); ctx.fill();
    ctx.fillStyle=ink;
  }else if(o.face==='soft'){                          // 뭉클 — 눈은 살짝 내리깔고 입은 잔잔하게
    ctx.lineWidth=1.8;
    for(const sg of [-1,1]){ ctx.beginPath(); ctx.moveTo(sg*hw*0.4-ew*0.7,ey+ew*0.7); ctx.quadraticCurveTo(sg*hw*0.4,ey+ew*1.3,sg*hw*0.4+ew*0.7,ey+ew*0.7); ctx.stroke(); }
    ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(0,hw*0.3,s*0.06,0.2*Math.PI,0.8*Math.PI); ctx.stroke();
  }else if(o.face==='smile'){
    for(const sg of [-1,1]){ ctx.beginPath(); ctx.arc(sg*hw*0.4,ey+ew*0.9,ew*0.75,Math.PI*1.15,Math.PI*1.85); ctx.stroke(); }
    ctx.beginPath(); ctx.arc(0,hw*0.3,s*0.08,0.15*Math.PI,0.85*Math.PI); ctx.stroke();
  }else{
    rr(-hw*0.4-ew/2,ey,ew,ew*1.3,ew*0.45); ctx.fill();
    rr(hw*0.4-ew/2,ey,ew,ew*1.3,ew*0.45); ctx.fill();
    ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(0,hw*0.3,s*0.06,0.2*Math.PI,0.8*Math.PI); ctx.stroke();
  }
  ctx.fillStyle='rgba(223,142,156,0.35)';                                              // 볼
  ctx.beginPath(); ctx.ellipse(-hw*0.62,hw*0.25,3,2,0,0,TAU); ctx.ellipse(hw*0.62,hw*0.25,3,2,0,0,TAU); ctx.fill();
  ctx.restore();
}

/* F 상호작용 표시 — 앞으로 중요한 것(사람·물건·문)에 다가가면 늘 이 모양으로 뜬다
   x,y: 대상 머리 위 / a: 투명도(0~1) / label: 한 단어 (대화·줍기·열기 …) */
function drawFKey(x,y,a,label){

  ctx.fillStyle='#2a323c'; ctx.font='800 13px '+FS.ui; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('F',0,-9.5);

/* ===== 반란 이후 — 불타는 폐허 · 15세 기준 최대한의 충격 =====
   원칙 (15세 이용가: 선혈은 과하지 않게, 사람 몸은 훼손하지 않는다)
   · 사람: 쓰러진 몸 + 웅덩이·끌린 자국·손자국까지. 절단·내장은 없다. 죽는 순간은 번쩍임과 멈춤으로 '보여 주지 않고 느끼게'

function stVictim(c,x,y,a,col,under,R){                // 쓰러진 사람 — 네모 몸, 감긴 눈, 몸 아래로 번진 피

/* ----- 불 · 연기 · 불똥 (매 프레임) ----- */
function ruinFires(){ const u=S.tut; if(!u.riot) return []; if(u.area==='cafe'&&!u.fireOn) return [];
  if(u.area==='cafe'&&u.fireK){ const o=[]; RUIN.cafe.fires.forEach((f,i)=>{ const k=u.fireK[i]||0; if(k>0.02) o.push([f[0],f[1],f[2]*k]); }); return o; }   // 하나씩 붙어서 커진다
  return RUIN[u.area].fires; }
function updateRuin(dt){
  const u=S.tut; if(!u.riot) return;
  u.embers=u.embers||[]; u.smoke=u.smoke||[];
  for(const f of ruinFires()){
    if(Math.random()<dt*7*f[2]) u.embers.push({x:f[0]+(Math.random()-0.5)*16*f[2],y:f[1]-10*f[2],vx:(Math.random()-0.5)*30,vy:-50-Math.random()*60,t:0,life:1+Math.random()*1.2});
    if(Math.random()<dt*1.6*f[2]) u.smoke.push({x:f[0]+(Math.random()-0.5)*10,y:f[1]-24*f[2],vx:8+Math.random()*10,vy:-22-Math.random()*14,r:10*f[2],t:0,life:3+Math.random()*2});
  }
  for(const e of u.embers){ e.t+=dt; e.x+=e.vx*dt+Math.sin(e.t*5+e.y)*0.3; e.y+=e.vy*dt; e.vy*=0.99; }
  for(const s of u.smoke){ s.t+=dt; s.x+=s.vx*dt; s.y+=s.vy*dt; s.r+=dt*14; }
  u.embers=u.embers.filter(e=>e.t<e.life).slice(-90);
  u.smoke=u.smoke.filter(s=>s.t<s.life).slice(-36);
  // 깨진 천장 조명에서 가끔 튀는 불꽃 (로비)
  if(u.area==='lobby'&&Math.random()<dt*0.6) sparks(120+Math.random()*(W-240),LB.top+40+Math.random()*700,Math.PI/2,6,180,0.8);
}
function drawFire(x,y,k){                             // 불길 — 주황 바깥, 노랑 속, 흰 심지. 혀가 따로따로 날름거린다

  tongue(0,(7+3*Math.sin(T*13))*k,3.2*k,'rgba(255,241,194,0.95)');
  ctx.fillStyle='rgba(40,28,20,0.85)'; ctx.beginPath(); ctx.ellipse(x,y+1,12*k,4*k,0,0,TAU); ctx.fill();   // 타는 잔해

function onScreen(x,y,m){ const zz=1+S.camZ+S.camP, X=S.focus.x+(x-S.focus.x)*zz, Y=S.focus.y+(y-S.focus.y)*zz; return X>-m&&X<W+m&&Y>-m&&Y<H+m; }

function drawRuinOver(){                              // 연기 · 불똥 — 인물 위로

  if(o.dead){ ctx.fillStyle=BLD(0.55); ctx.beginPath(); ctx.ellipse(hw*0.3,hw*0.2,7,5,0.6,0,TAU); ctx.fill(); }
  ctx.strokeStyle='#1c232c'; ctx.fillStyle='#1c232c'; ctx.lineCap='round'; ctx.lineWidth=1.8;
  const ew=Math.max(2.3,s*0.09), ey=-hw*0.06;

  else if(o.face==='scared'){ for(const sg of [-1,1]){ ctx.beginPath(); ctx.arc(sg*hw*0.42,ey+2,ew*0.75,0,TAU); ctx.stroke(); } ctx.beginPath(); ctx.ellipse(0,hw*0.34,s*0.05,s*0.07,0,0,TAU); ctx.fill(); }
  else{ const lx=(o.lookX||0)*hw*0.14; rr(-hw*0.42-ew/2+lx,ey,ew,ew*1.3,ew*0.45); ctx.fill(); rr(hw*0.42-ew/2+lx,ey,ew,ew*1.3,ew*0.45); ctx.fill();

/* ----- 컷신 음악 — 효과음 엔진으로 직접 만드는 짧은 큐 (반란: 묵직한 충격 / 리본: 슬픈 선율) ----- */
function pad(f,dur,vol,type,att,delay,lp,f2){            // 천천히 차오르는 긴 음 (패드·드론)
  const a=ac; if(!a||!OPT.snd) return;
  const t=a.currentTime+(delay||0), o=a.createOscillator(); o.type=type||'sine';
  o.frequency.setValueAtTime(f,t); if(f2) o.frequency.linearRampToValueAtTime(f2,t+dur);
  const g=a.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+att);
  g.gain.setValueAtTime(vol,t+Math.max(att,dur-Math.min(1.2,dur*0.4))); g.gain.linearRampToValueAtTime(0.0001,t+dur);
  let n=o; if(lp){ const bq=a.createBiquadFilter(); bq.type='lowpass'; bq.frequency.value=lp; o.connect(bq); n=bq; }
  n.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.05);
}
function note(f,dur,vol,delay){                          // 피아노 비슷한 한 음 — 사인 + 살짝 배음, 길게 사라진다
  const a=ac; if(!a||!OPT.snd) return;
  for(const [m,v] of [[1,1],[2,0.28],[3,0.08]]){ const t=a.currentTime+(delay||0), o=a.createOscillator(); o.type='sine'; o.frequency.value=f*m;
    const g=a.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol*v,t+0.012); g.gain.exponentialRampToValueAtTime(0.0006,t+dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.05); }
}

function cueStop(fade){ if(!CUE||!ac) return; const g=CUE, t=ac.currentTime; g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(g.gain.value,t); g.gain.linearRampToValueAtTime(0.0001,t+(fade||0.15)); setTimeout(()=>{ try{g.disconnect();}catch(e){} },((fade||0.15)+0.1)*1000); CUE=null; }
function cNote(bus,f,dur,vol,delay,type){ const a=ac; if(!a||!bus) return; const t=a.currentTime+(delay||0);
  for(const [m,v] of [[1,1],[2,0.25],[3,0.07]]){ const o=a.createOscillator(); o.type=type||'sine'; o.frequency.value=f*m; const g=a.createGain();
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol*v,t+0.01); g.gain.exponentialRampToValueAtTime(0.0005,t+dur); o.connect(g); g.connect(bus); o.start(t); o.stop(t+dur+0.05); } }
function cPad(bus,f,dur,vol,type,att,delay,lp){ const a=ac; if(!a||!bus) return; const t=a.currentTime+(delay||0), o=a.createOscillator(); o.type=type||'sawtooth'; o.frequency.value=f;
  const o2=a.createOscillator(); o2.type=o.type; o2.frequency.value=f*1.006;
  const g=a.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+att); g.gain.setValueAtTime(vol,t+Math.max(att,dur-0.5)); g.gain.linearRampToValueAtTime(0.0001,t+dur);
  const bq=a.createBiquadFilter(); bq.type='lowpass'; bq.frequency.setValueAtTime(lp||900,t); bq.frequency.linearRampToValueAtTime((lp||900)*2.2,t+dur*0.6);
  o.connect(bq); o2.connect(bq); bq.connect(g); g.connect(bus); o.start(t); o2.start(t); o.stop(t+dur+0.05); o2.stop(t+dur+0.05); }
function cHit(bus,f0,f1,dur,vol,delay){ const a=ac; if(!a||!bus) return; const t=a.currentTime+(delay||0), o=a.createOscillator(); o.type='sine';
  o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f1,t+dur); const g=a.createGain();
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+0.005); g.gain.exponentialRampToValueAtTime(0.0005,t+dur); o.connect(g); g.connect(bus); o.start(t); o.stop(t+dur+0.05); }

function tutStory(dt){
  const u=S.tut, p=S.player;
  if(!u.riot&&u.area!=='lobby'&&u.area!=='cafe') return;
  // 적 등장 대기열
  for(const q of u.spawnQ){ q.t-=dt; if(q.t<=0&&!q.done){ q.done=true; tutSpawn(q); if(q.door) u.staffOpen=1; } }
  u.spawnQ=u.spawnQ.filter(q=>!q.done);
  // 전투 — 본편과 같은 규칙으로 돌린다 (1층은 근접만)
  if(u.combat&&!u.tr){
    updateCombat(dt); updateEnemies(dt); separateEnemies(); updateBolts(dt); updateShocks(dt); updateHazards(dt); updateDebris(dt);
    compact(S.enemies,e=>!e.dead);
    if(!S.enemies.length&&!u.spawnQ.length){
      if(u.wave2){ tutQueue(u.wave2); u.wave2=null; }
      else tutFightDone();
    }
    // 회피 배우기 — 근처 적이 빨간 범위를 채우는 동안만 SPACE (한 번 피하면 끝)
    u.dodgeHint=false;
    if(!u.dodgeOk&&u.fight==='desk') for(const e of S.enemies) if(e.state==='wind'&&Math.hypot(e.x-p.x,e.y-p.y)<140){ u.dodgeHint=true; if(p.dash) u.dodgeOk=true; }
  }
  if(u.staffOpen>0&&u.area==='cafe') u.staffOpen=Math.max(u.stage==='exit1'?1:0,u.staffOpen-dt*0.2);
  // 컷신
  if(u.stage==='sit'||u.stage==='riot') tutRiot(dt*(u.ts||1));          // 학살 장면은 슬로우모션
  if(u.stage==='ribbonCut') tutRibbonCut(dt);
  if(u.stage==='miniIntro') tutMiniIntro(dt);
  if(u.stage==='ambush') tutAmbush(dt);
  if(!TUT_LOCK[u.stage]) tutPacks();
  if(S.gainT>0) S.gainT=Math.max(0,S.gainT-dt);
  for(const e of S.enemies) if(e.guardOff>0){ e.guardOff-=dt; if(e.guardOff<=0&&ac&&OPT.snd){ beep(600,0.25,0.05,'sine',1200); } }   // 가드가 다시 차오른다
  if(u.stage==='end'){ u.fade=Math.min(1,u.fade+dt*1.2); if(u.fade>=1&&u.t>1.1){ endTutorial('tut.end1'); return; } }
  updateRuin(dt); updateBlood(dt*(u.ts||1));
  if(u.lightK!==undefined&&u.lightK<1&&u.fireOn) u.lightK=Math.min(1,u.lightK+dt*0.8);
  // 남은 효과
  u.dark=lerp(u.dark||0,u.darkT||0,Math.min(1,dt*6));
  if(u.pipeDrop) { const d=u.pipeDrop; if(d.y<d.y1){ d.vy+=1600*dt; d.y=Math.min(d.y1,d.y+d.vy*dt); d.rot+=dt*9; if(d.y>=d.y1){ d.rot=0.35; sfx.clang(1); sfx.pipeHit(1.2,true); dust(d.x,d.y1,14,160); S.shake=Math.max(S.shake,5); } } }
}

/* ===== 아트 규칙 — 선과 잉크 =====
   잉크는 한 색, 선은 두 단계: 캐릭터 테두리(LINE_CHAR) / 나머지 얇은 선(LINE_THIN) */
const INK='#222a35', LINE_CHAR=2.2, LINE_THIN=1.5;

/* ===== 그리기 — 로봇 ===== */
function areaPath(f){
  ctx.beginPath();
  if(f.type==='circle') ctx.arc(f.x,f.y,f.r,0,TAU);
  else if(f.type==='claw'){                        // 초승달: 차오를 때 한쪽에서 반대쪽으로 쓸려간다
    const k=f.sweep===undefined?1:f.sweep, sd=f.side||1, a0=f.a-sd*f.arc, a1=a0+sd*2*f.arc*k;
    ctx.arc(f.x,f.y,f.r,a0,a1,sd<0); ctx.arc(f.x,f.y,f.ri,a1,a0,sd>0); ctx.closePath();
  }else if(f.type==='hex'){
    for(let i=0;i<6;i++){ const a=f.a+i*Math.PI/3; i?ctx.lineTo(f.x+Math.cos(a)*f.r,f.y+Math.sin(a)*f.r):ctx.moveTo(f.x+Math.cos(a)*f.r,f.y+Math.sin(a)*f.r); }
    ctx.closePath();
  }else if(f.type==='cross'){                       // 십자: 차오를 때 네 팔이 함께 자란다
    const c=Math.cos(f.a), s=Math.sin(f.a), L=Math.max(0,f.r), w=Math.min(f.w,L);
    const P=[[L,w],[w,w],[w,L],[-w,L],[-w,w],[-L,w],[-L,-w],[-w,-w],[-w,-L],[w,-L],[w,-w],[L,-w]];
    P.forEach(([u,v],i)=>{ const px=f.x+c*u-s*v, py=f.y+s*u+c*v; i?ctx.lineTo(px,py):ctx.moveTo(px,py); });
    ctx.closePath();
  }else if(f.type==='line'){                         // 선: 시작점에서 a 방향으로 r만큼 (차오를 때 앞으로 자란다)
    const c=Math.cos(f.a), s=Math.sin(f.a), b=-f.w*0.5, L=Math.max(0,f.r), w=f.w;
    ctx.moveTo(f.x+c*b-s*w,f.y+s*b+c*w); ctx.lineTo(f.x+c*L-s*w,f.y+s*L+c*w);
    ctx.lineTo(f.x+c*L+s*w,f.y+s*L-c*w); ctx.lineTo(f.x+c*b+s*w,f.y+s*b-c*w); ctx.closePath();
  }else{ ctx.moveTo(f.x,f.y); ctx.arc(f.x,f.y,f.r,f.a-f.arc,f.a+f.arc); ctx.closePath(); }
}
// 빨간 범위: 바깥 틀은 처음부터 그대로, 안쪽이 차오른다. 다 차면 번쩍.
function drawTelegraph(e){
  if(e.state!=='wind'||e.dying||e.type==='boss'||e.type==='zone')return;

function drawWarn(g,wk){
  const late=wk>0.75;

  ctx.fillStyle='rgba(255,60,45,'+(0.07+wk*0.06).toFixed(3)+')'; ctx.fill();

  areaPath(fill);
  ctx.fillStyle='rgba(255,55,40,'+(0.18+wk*0.14).toFixed(3)+')'; ctx.fill();
  areaPath(g);
  ctx.strokeStyle='rgba(230,50,35,'+(0.45+wk*0.5).toFixed(3)+')';
  ctx.lineWidth=late?2.2:LINE_THIN; ctx.stroke();
}
function drawAreaFx(){

function drawFloats(){

    ctx.fillText(f.txt,0,0);
    ctx.restore();
  }
  ctx.globalAlpha=1; ctx.textBaseline='alphabetic';

function drawRobot(e){
  const T=ENEMY_TYPES[e.type], boss=e.type==='boss', big=e.type==='brute'||boss;
  const wk=e.state==='wind'?Math.min(1,e.st/(boss?e.castT:e.wind)):0;
  let off=0;
  if(e.state==='wind') off=-wk*(big?3:e.type==='charger'?10:7);
  else if(e.state==='strike'&&e.type!=='charger') off=(1-e.st/STRIKE_T)*(big?4:12);
  let x=e.x+Math.cos(e.aim)*off, y=e.y+Math.sin(e.aim)*off;
  if(e.dying&&!e.split){ const j=2+e.ot*16; x+=(Math.random()-0.5)*j; y+=(Math.random()-0.5)*j; }
  else if(e.stun>0&&!e.dying){ x+=(Math.random()-0.5)*3; y+=(Math.random()-0.5)*3; }
  const sp=e.spawn>0?1-e.spawn/(e.spawnMax||SPAWN_T):1;
  let s=e.s*(1+e.punch*(boss?0.05:0.16));
  if(big&&e.state==='wind') s*=1+wk*0.14;
  if(big&&e.state==='strike') s*=1.14-0.14*(e.st/STRIKE_T);
  if(e.dying&&!e.split) s*=1+e.ot*0.6;
  s*=0.4+0.6*sp;
  if(e.type==='bomber'&&e.state==='wind') s*=1+wk*0.22+(Math.floor(Math.pow(wk,1.6)*9)%2)*0.06;
  const hw=s/2, cr=e.type==='bomber'?s*0.5:s*(big?0.16:0.22);
  ctx.save();
  if(sp<1) ctx.globalAlpha=sp;
  ctx.fillStyle='rgba(28,36,46,0.18)';
  ctx.beginPath(); ctx.ellipse(x+2,y+5,hw*0.95,hw*0.8,0,0,TAU); ctx.fill();
  const body=(bx,by,rx)=>{
    ctx.save();
    ctx.translate(bx,by+Math.sin(e.bob)*1.1); ctx.rotate(e.lean+rx);
    const step=Math.sin(e.bob)*2;
    ctx.fillStyle='#1a1e23';
    rr(-hw*0.74,hw-4+step,s*0.3,7,2); ctx.fill();
    rr(hw*0.74-s*0.3,hw-4-step,s*0.3,7,2); ctx.fill();
    if(big){
      const lift=wk*4;
      ctx.fillStyle='#4a5059'; ctx.strokeStyle=INK; ctx.lineWidth=LINE_THIN;
      rr(-hw-6,-hw*0.6-lift,10,s*0.58,3); ctx.fill(); ctx.stroke();
      rr(hw-4,-hw*0.6-lift,10,s*0.58,3); ctx.fill(); ctx.stroke();
    }
    const flash=e.flash>0||sp<0.5||(e.type==='bomber'&&e.state==='wind'&&Math.floor(Math.pow(wk,1.6)*9)%2===1);
    ctx.fillStyle=flash?'#ffffff':T.col.b;
    rr(-hw,-hw,s,s,cr); ctx.fill();
    ctx.save(); rr(-hw,-hw,s,s,cr); ctx.clip();
    if(!flash){
      ctx.fillStyle=T.col.t; ctx.fillRect(-hw,-hw,s,s*0.26);
      ctx.fillStyle='rgba(0,0,0,0.24)'; ctx.fillRect(-hw,hw*0.45,s,s);
      ctx.strokeStyle='rgba(255,255,255,0.08)'; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(-hw,hw*0.3); ctx.lineTo(hw,hw*0.3); ctx.stroke();
      if(big){ ctx.fillStyle='#e0a32e'; for(let i=-2;i<=2;i++) ctx.fillRect(i*s*0.14-2,hw*0.52,4,s*0.12); }
      if(boss){                                  // 가슴 코어 — 공격 준비 때 붉게 달아오른다
        const g=0.5+0.5*e.eye, pulse=0.85+0.15*Math.sin(S.t*8);
        ctx.fillStyle='rgba(255,60,40,'+(0.3*g*pulse).toFixed(2)+')'; ctx.beginPath(); ctx.arc(0,hw*0.2,s*0.16,0,TAU); ctx.fill();
        ctx.fillStyle=e.eye>0.3?'#ffd2c8':'#ff6a4a'; ctx.beginPath(); ctx.arc(0,hw*0.2,s*0.07,0,TAU); ctx.fill();
        ctx.fillStyle='#1a1e23'; for(const sx of [-1,1]){ ctx.beginPath(); ctx.moveTo(sx*hw*0.55,-hw); ctx.lineTo(sx*hw*0.75,-hw-s*0.16); ctx.lineTo(sx*hw*0.3,-hw); ctx.fill(); }
      }
      if(e.hp<=e.maxHp*0.5){
        ctx.strokeStyle='rgba(10,12,15,0.8)'; ctx.lineWidth=1.4;
        ctx.beginPath(); ctx.moveTo(-hw*0.6,-hw*0.9); ctx.lineTo(-hw*0.2,-hw*0.4); ctx.lineTo(-hw*0.35,0); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(hw*0.8,hw*0.1); ctx.lineTo(hw*0.35,hw*0.35); ctx.stroke();
        if(Math.random()<0.25){ ctx.fillStyle='#ffd15a'; ctx.beginPath(); ctx.arc(-hw*0.3,-hw*0.45,1.6,0,TAU); ctx.fill(); }
      }
      if(e.type==='charger'){                    // 앞으로 튀어나온 들이받이 판 + 주황 줄
        ctx.fillStyle='#a8784e'; ctx.fillRect(-hw,-hw*0.02,s,s*0.1);
        ctx.fillStyle='#1a1e23'; for(let i=-1;i<=1;i++) ctx.fillRect(i*s*0.26-2,-hw*0.02,4,s*0.1);
      }
      if(e.type==='bomber'){                     // 경고 줄무늬 띠
        ctx.fillStyle='#9c5a52'; ctx.fillRect(-hw,hw*0.25,s,s*0.14);
        ctx.fillStyle='#1a1e23'; for(let i=-2;i<=2;i++) ctx.fillRect(i*s*0.2-1.5,hw*0.25,3,s*0.14);
      }
      if(e.type==='zone'){                       // 등에 진 방출판
        ctx.fillStyle='#5b6169'; ctx.fillRect(-hw,hw*0.35,s,s*0.2);
        ctx.fillStyle='rgba(255,80,60,'+(0.35+0.5*e.eye).toFixed(2)+')';
        for(let i=-1;i<=1;i++){ ctx.beginPath(); ctx.arc(i*s*0.28,hw*0.55,s*0.05,0,TAU); ctx.fill(); }
      }
      if(e.dying){
        const g=Math.min(1,e.ot/T.over);
        ctx.fillStyle='rgba(255,'+Math.round(140-g*60)+',40,'+(0.25+g*0.6).toFixed(2)+')';
        ctx.fillRect(-hw,-hw,s,s);
      }
    }
    ctx.restore();
    ctx.strokeStyle=flash?'#8d99a6':INK; ctx.lineWidth=LINE_CHAR;
    rr(-hw,-hw,s,s,cr); ctx.stroke();
    const vy=-hw*0.2, vw=s*(big?0.7:0.64), vh=s*(big?0.16:0.18);
    ctx.fillStyle='#0b0d10'; rr(-vw/2,vy,vw,vh,vh/2); ctx.fill();
    let on=true, eyeCol=EYE_STEPS[Math.round(clamp(e.eye,0,1)*20)];
    if(e.glitch>0&&Math.random()<0.5) on=false;
    if(e.stun>0&&Math.random()<0.35) on=false;
    if(e.dying) eyeCol=Math.random()<0.5?'#ffffff':EYE_HOT;
    if(sp<1) on=Math.random()<sp;
    if(on){
      const ex=Math.cos(e.aim)*vw*0.16;
      ctx.fillStyle=eyeCol;
      if(big){
        ctx.globalAlpha*=0.35; ctx.beginPath(); ctx.arc(ex-vw*0.2,vy+vh/2,vh*1.1,0,TAU); ctx.arc(ex+vw*0.2,vy+vh/2,vh*1.1,0,TAU); ctx.fill();
        ctx.globalAlpha/=0.35;
        ctx.beginPath(); ctx.arc(ex-vw*0.2,vy+vh/2,vh*0.32,0,TAU); ctx.arc(ex+vw*0.2,vy+vh/2,vh*0.32,0,TAU); ctx.fill();
      }else{
        const lw=vw*(0.34+0.3*e.eye);
        ctx.globalAlpha*=0.3; rr(ex-lw/2-3,vy-1,lw+6,vh+2,vh/2); ctx.fill(); ctx.globalAlpha/=0.3;
        rr(ex-lw/2,vy+vh*0.28,lw,vh*0.44,vh*0.22); ctx.fill();
      }
    }
    if(!big){
      ctx.strokeStyle='#1a1e23'; ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.moveTo(hw*0.35,-hw); ctx.lineTo(hw*0.5,-hw-6); ctx.stroke();
      ctx.fillStyle=(Math.floor(S.t*3+e.bob)%2)?EYE_IDLE:'#5a3a14';
      ctx.beginPath(); ctx.arc(hw*0.5,-hw-6,1.8,0,TAU); ctx.fill();
    }
    ctx.restore();
  };
  if(e.split){
    // 두 동강 — 잘린 면을 따라 벌어지며 각자 돈다
    const k=Math.min(1,e.ot/0.28), ease=1-Math.pow(1-k,2);
    const sep=ease*s*0.95, cx=Math.cos(e.cut), cy=Math.sin(e.cut), nx=-cy, ny=cx, R=s*2;
    for(const sd of [-1,1]){
      const ox=x+nx*sep*sd*0.5, oy=y+ny*sep*sd*0.5;
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(ox-cx*R,oy-cy*R); ctx.lineTo(ox+cx*R,oy+cy*R);
      ctx.lineTo(ox+cx*R+nx*R*sd,oy+cy*R+ny*R*sd); ctx.lineTo(ox-cx*R+nx*R*sd,oy-cy*R+ny*R*sd);
      ctx.closePath(); ctx.clip();
      body(ox,oy,sd*ease*0.35);
      ctx.restore();
      // 달아오른 절단면
      const hot=0.5+0.5*Math.random();
      ctx.lineCap='round';
      ctx.strokeStyle='rgba(255,120,30,'+(0.75*hot).toFixed(2)+')'; ctx.lineWidth=4;
      ctx.beginPath(); ctx.moveTo(ox-cx*hw*0.95,oy-cy*hw*0.95); ctx.lineTo(ox+cx*hw*0.95,oy+cy*hw*0.95); ctx.stroke();
      ctx.strokeStyle='rgba(255,245,200,'+hot.toFixed(2)+')'; ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.moveTo(ox-cx*hw*0.85,oy-cy*hw*0.85); ctx.lineTo(ox+cx*hw*0.85,oy+cy*hw*0.85); ctx.stroke();
    }
  }else body(x,y,0);
  ctx.restore();
  if(!e.dying&&sp>=1&&e.type==='grunt') drawBaton(e,x,y,s,wk);
  if(!e.dying&&sp>=1) drawTypeDeco(e,x,y,s,wk);
  if((boss||e.mini)&&!e.dying&&sp>0.6&&!S.cut) drawBossBar(e,x,y,s);
}
function drawBossBar(e,x,y,s){                   // 보스 머리 위: 이름 + 체력바
  const bw=130, bh=9, bx=x-bw/2, by=y-s*0.78-18, hp=Math.max(0,e.hp/e.maxHp);
  ctx.fillStyle='rgba(20,24,30,0.55)'; ctx.fillRect(bx-2,by-2,bw+4,bh+4);
  ctx.fillStyle='rgba(255,255,255,0.25)'; ctx.fillRect(bx,by,bw,bh);
  ctx.fillStyle=e.phase2?'rgba(225,70,55,0.98)':'rgba(192,82,76,0.98)'; ctx.fillRect(bx,by,bw*hp,bh);
  ctx.fillStyle='rgba(255,255,255,0.3)'; ctx.fillRect(bx,by,bw*hp,bh*0.35);
  ctx.font=fUI(15); ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  ctx.lineWidth=4; ctx.strokeStyle='rgba(255,255,255,0.9)'; ctx.strokeText(e.name||ENEMY_TYPES.boss.name,x,by-6);
  ctx.fillStyle='rgba(40,46,56,0.95)'; ctx.fillText(e.name||ENEMY_TYPES.boss.name,x,by-6);
}
function drawTypeDeco(e,x,y,s,wk){
  if(e.type==='charger'){                         // 진행 방향의 쐐기 뿔
    const a=e.state==='wind'||e.state==='strike'?e.ta:e.aim, c=Math.cos(a), sn=Math.sin(a), hw=s/2;
    const bx=x+c*hw*0.9, by=y+sn*hw*0.9, L=s*(0.42+wk*0.12), W=s*0.34;
    ctx.fillStyle=e.state==='strike'?'#ffd2a8':ENEMY_TYPES.charger.col.t; ctx.strokeStyle=INK; ctx.lineWidth=LINE_THIN; ctx.lineJoin='round';
    ctx.beginPath(); ctx.moveTo(bx-sn*W,by+c*W); ctx.lineTo(bx+c*L,by+sn*L); ctx.lineTo(bx+sn*W,by-c*W); ctx.closePath();
    ctx.fill(); ctx.stroke();
  }else if(e.type==='bomber'){                    // 머리 위 경고등
    const hot=e.state==='wind'?(Math.floor(Math.pow(wk,1.6)*9)%2===0):(Math.floor(S.t*2.5+e.bob)%2===0);
    const ly=y-s*0.5-5;
    ctx.fillStyle='#1a1e23'; ctx.fillRect(x-1.5,ly,3,5);
    ctx.fillStyle=hot?'#ff3426':'#5a1a14'; ctx.beginPath(); ctx.arc(x,ly,3.4,0,TAU); ctx.fill();
    if(hot){ ctx.fillStyle='rgba(255,60,40,0.25)'; ctx.beginPath(); ctx.arc(x,ly,7,0,TAU); ctx.fill(); }
  }else if(e.type==='zone'){                      // 머리 위 원반 안테나
    const ly=y-s*0.5-4, r=s*0.32;
    ctx.strokeStyle=INK; ctx.lineWidth=LINE_THIN; ctx.fillStyle='#4a5059';
    ctx.beginPath(); ctx.ellipse(x,ly,r,r*0.38,0,0,TAU); ctx.fill(); ctx.stroke();
    if(e.state==='wind'){ ctx.strokeStyle='rgba(255,80,60,'+(0.7*(1-wk)+0.2).toFixed(2)+')'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.ellipse(x,ly,r*(1+wk*1.2),r*0.38*(1+wk*1.2),0,0,TAU); ctx.stroke(); }
  }
}
function drawBaton(e,x,y,s,wk){
  let a=e.aim;
  if(e.state==='wind') a-=wk*1.1*e.side;
  else if(e.state==='strike') a+=(e.st/STRIKE_T)*0.7*e.side-0.2*e.side;
  else if(e.state==='rec') a+=0.5*e.side*(1-e.st/ENEMY_TYPES.grunt.rec);
  ctx.save(); ctx.translate(x,y); ctx.rotate(a); ctx.translate(s*0.36,e.side*s*0.3);
  ctx.fillStyle='#16191d'; rr(-4,-2.6,9,5.2,2); ctx.fill();
  ctx.fillStyle='#5a616b'; ctx.strokeStyle='#14181d'; ctx.lineWidth=1.2;
  rr(4,-2,s*0.62,4,2); ctx.fill(); ctx.stroke();
  const tx=4+s*0.62;
  const glow=e.state==='wind'?wk:e.state==='strike'?1:0.15;
  ctx.fillStyle='rgba('+CYAN_RGB+','+(0.2+glow*0.4).toFixed(2)+')';
  ctx.beginPath(); ctx.arc(tx,0,3+glow*5,0,TAU); ctx.fill();
  ctx.fillStyle=glow>0.5?'#ffffff':'#bdf0ff';
  ctx.beginPath(); ctx.arc(tx,0,2+glow*1.5,0,TAU); ctx.fill();
  ctx.restore();
}

/* ===== 그리기 — 플레이어 ===== */
/* ===== 주인공 그림 규칙 (B형) =====
   통짜 둥근 사각형 몸 + 몸에 안 붙은 '떠 있는 손' 두 개
   매트한 옷감: 광택·그림자 띠 없는 차분한 한 색, 손발은 한 톤 어둡게
   사람은 떠 있는 손, 로봇은 몸에 붙은 팔과 무기 */
const HERO={body:'#bfcbd6', foot:'#6f7d96'};
function drawPlayer(){
  const p=S.player;
  for(let i=0;i<p.trail.length;i++){
    const tr=p.trail[i], hw=p.s/2;
    ctx.globalAlpha=(i+1)/p.trail.length*0.3;
    ctx.fillStyle='#9fe3f7'; rr(tr.x-hw,tr.y-hw,p.s,p.s,p.s*0.3); ctx.fill();
  }
  ctx.globalAlpha=1;
  const x=p.x+Math.cos(p.kang)*p.kick*10, y=p.y+Math.sin(p.kang)*p.kick*10;
  const s=p.s*(1+p.punch*0.12), hw=s/2;
  const landed=p.dead&&S.death&&S.death.landed;
  const blink=!p.dead&&p.inv>0&&Math.floor(p.inv*22)%2===0;
  ctx.fillStyle='rgba(28,38,50,0.2)';
  ctx.beginPath(); ctx.ellipse(x+2,y+4,hw*0.95,hw*0.85,0,0,TAU); ctx.fill();
  ctx.save();
  ctx.translate(x,y+(p.dead?0:Math.sin(p.bob)*1.5));
  ctx.rotate(p.dead?p.rot:p.lean);
  if(landed) ctx.scale(1.08,0.8);
  if(OPT.mv.squash&&!p.dead){                       // 늘이고 누르기 — 회피 중엔 진행 방향으로 늘어나고, 멈출 때 살짝 눌린다
    if(p.dash){ const a=Math.atan2(p.dash.dy,p.dash.dx)-(p.lean||0), k=1-p.dash.t/p.dash.dur;
      ctx.rotate(a); ctx.scale(1+0.18*k,1-0.14*k); ctx.rotate(-a); }
    else if(p.squashT>0){ const k=p.squashT/0.12; ctx.scale(1+0.1*k,1-0.1*k); }
  }
  const foot=p.dead?0:Math.sin(p.bob)*2.4;
  ctx.fillStyle=HERO.foot; ctx.strokeStyle=INK; ctx.lineWidth=LINE_THIN; ctx.lineJoin='round';
  rr(-hw*0.62,hw-3+foot,s*0.28,6,2); ctx.fill(); ctx.stroke();
  rr(hw*0.62-s*0.28,hw-3-foot,s*0.28,6,2); ctx.fill(); ctx.stroke();
  if(!p.dead&&!p.dash&&p.idleT>0) ctx.translate(0,Math.sin(S.t*2.4)*1.1);
  if(p.nod>0) ctx.translate(0,Math.sin((1-p.nod/0.24)*Math.PI)*3);
  if(p.pick>0) ctx.translate(0,Math.sin((1-p.pick/0.5)*Math.PI)*6);   // 몸을 숙여 줍기
  if(p.shiver>0){ p.shiver=Math.max(0,p.shiver-0.016); ctx.translate((Math.random()-0.5)*1.4*p.shiver,(Math.random()-0.5)*1.4*p.shiver); }   // 굳으며 살짝 떨린다   // 끄덕 — 몸통만 살짝 내려갔다 올라온다 (모양은 그대로)   // 숨쉬기 — 모양은 그대로, 몸통 높이만 1픽셀 남짓 오르내린다 (발은 땅에)
  ctx.fillStyle=p.redT>0?'#ff8576':blink?'#ffffff':HERO.body;   // 매트한 옷감 — 한 색 덩어리 (띠·그림자 없음)
  rr(-hw,-hw,s,s,s*0.3); ctx.fill();
  ctx.strokeStyle=INK; ctx.lineWidth=LINE_CHAR;
  rr(-hw,-hw,s,s,s*0.3); ctx.stroke();
  // 어깨의 조준 보조 장치
  ctx.fillStyle='#2a3038'; rr(-hw*1.02,-hw*1.0,s*0.34,s*0.24,3); ctx.fill();
  const ledOn=!p.dead&&p.armed&&p.draw>=1;
  ctx.fillStyle=ledOn?CYAN:'#4a5560';
  if(ledOn){ ctx.globalAlpha=0.35; ctx.beginPath(); ctx.arc(-hw*0.68,-hw*0.88,5,0,TAU); ctx.fill(); ctx.globalAlpha=1; }
  ctx.beginPath(); ctx.arc(-hw*0.68,-hw*0.88,2,0,TAU); ctx.fill();
  // 얼굴
  const ink='#1c232c', ey=-hw*0.08, ew=Math.max(2.4,s*0.09);
  ctx.save(); if(p.lookX) ctx.translate(p.lookX*hw*0.16,0);   // 둘러볼 때 눈·입이 그쪽으로 (몸 모양은 그대로)
  ctx.strokeStyle=ink; ctx.fillStyle=ink; ctx.lineCap='round';
  if(p.dead){                                     // 감긴 눈
    ctx.lineWidth=2;
    for(const sg of [-1,1]){ ctx.beginPath(); ctx.moveTo(sg*hw*0.42-ew*0.7,ey+ew*0.6); ctx.lineTo(sg*hw*0.42+ew*0.7,ey+ew*0.6); ctx.stroke(); }
    ctx.beginPath(); ctx.arc(0,hw*0.42,s*0.07,Math.PI*1.15,Math.PI*1.85); ctx.stroke();
  }else if(p.hurt>0){                             // > <
    ctx.lineWidth=2;
    for(const sg of [-1,1]){ const cx=sg*hw*0.42;
      ctx.beginPath(); ctx.moveTo(cx-sg*ew*0.7,ey-ew*0.2); ctx.lineTo(cx+sg*ew*0.6,ey+ew*0.55); ctx.lineTo(cx-sg*ew*0.7,ey+ew*1.3); ctx.stroke(); }
    ctx.beginPath(); ctx.ellipse(0,hw*0.38,s*0.08,s*0.06,0,0,TAU); ctx.fill();
  }else if(p.face==='smile'){                     // 웃는 얼굴 — 눈은 평소 그대로, 입만 웃는다 (반란 전 평화로운 때만)
    rr(-hw*0.42-ew/2,ey,ew,ew*1.3,ew*0.45); ctx.fill();
    rr(hw*0.42-ew/2,ey,ew,ew*1.3,ew*0.45); ctx.fill();
    ctx.lineWidth=1.8; ctx.beginPath(); ctx.arc(0,hw*0.26,s*0.08,0.15*Math.PI,0.85*Math.PI); ctx.stroke();
  }else{
    rr(-hw*0.42-ew/2,ey,ew,ew*1.3,ew*0.45); ctx.fill();
    rr(hw*0.42-ew/2,ey,ew,ew*1.3,ew*0.45); ctx.fill();
    ctx.globalAlpha=0.6; rr(-s*0.09,hw*0.34,s*0.18,Math.max(1.6,s*0.05),1); ctx.fill(); ctx.globalAlpha=1;
  }
  ctx.restore();
  // 넣은 무기는 몸에 그리지 않는다 — 넣으면 사라지고, 꺼내면 생긴다
  ctx.restore();
}
function aimAngle(){
  const p=S.player;
  return S.aim?Math.atan2(S.aim.y-p.y,S.aim.x-p.x):Math.atan2(p.fy,p.fx);
}
function drawBladeShape(x,y,ang,r0,len,glow,flick,rgb){
  rgb=rgb||CYAN_RGB;
  ctx.save(); ctx.translate(x,y); ctx.rotate(ang);
  ctx.fillStyle='#1f252c'; ctx.strokeStyle='#0f1317'; ctx.lineWidth=1.2;
  rr(r0,-2.8,9,5.6,2); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#8b96a2'; ctx.fillRect(r0+8,-4,2.2,8);
  if(len>1){
    const b0=r0+10, b1=b0+len;
    if(glow>0.02){
      ctx.strokeStyle='rgba('+rgb+','+(0.22*glow).toFixed(2)+')'; ctx.lineWidth=10; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(b0,0); ctx.lineTo(b1,0); ctx.stroke();
      ctx.strokeStyle='rgba('+rgb+','+(0.55*glow).toFixed(2)+')'; ctx.lineWidth=5;
      ctx.beginPath(); ctx.moveTo(b0,0); ctx.lineTo(b1-2,0); ctx.stroke();
    }
    ctx.fillStyle=glow>0.02?'#ffffff':'#9aa5b0';
    ctx.beginPath(); ctx.moveTo(b0,-2.4); ctx.lineTo(b1-5,-1.6); ctx.lineTo(b1,0); ctx.lineTo(b1-5,1.6); ctx.lineTo(b0,2.4);
    ctx.closePath(); ctx.fill();
    if(flick){ ctx.strokeStyle='#ffffff'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(b0+len*Math.random(),0);
      ctx.lineTo(b0+len*Math.random(),(Math.random()-0.5)*8); ctx.stroke(); }
  }
  ctx.restore();
}
function drawPipeShape(x,y,ang,r0,len,glowRGB){              // 쇠파이프 — 무광 회색 관, 양 끝은 어두운 이음쇠
  len*=0.75;                                                    // 크기 75% (길이), 굵기도 살짝 줄인다
  ctx.save(); ctx.translate(x,y); ctx.rotate(ang); ctx.scale(1,0.8);
  if(glowRGB){ ctx.strokeStyle='rgba('+glowRGB+',0.45)'; ctx.lineWidth=11; ctx.lineCap='round'; ctx.beginPath(); ctx.moveTo(r0,0); ctx.lineTo(r0+len,0); ctx.stroke(); }

function drawRevolverShape(x,y,ang,back,flash,scale){       // 리볼버 — 긴 총신 + 둥근 실린더 + 나무 손잡이
  ctx.save(); ctx.translate(x,y); ctx.rotate(ang); ctx.scale(scale,Math.cos(ang)<0?-scale:scale);   // 왼쪽을 겨눌 땐 위아래를 뒤집어 손잡이가 늘 아래로

  ctx.fillStyle='#2b3137'; rr(o+3,-3,L-3,5,1.6); ctx.fill(); ctx.stroke();       // 총신

function drawGunShape(x,y,ang,back,flash,scale,id){

function drawPlayerWeapons(){
  const p=S.player;
  const x=p.x+Math.cos(p.kang)*p.kick*10, y=p.y+Math.sin(p.kang)*p.kick*10;

    const bladeMode=S.meleeOut||!!S.swing||!rangedW();

        drawPipeShape(x,y,rest,BLADE_R0(),mw.range-10,ready?HEAVY_RGB:null);
      }else if(mw.id==='blade'){
        const rest=p.restAng!==null&&S.meleeOut?p.restAng:aim+1.05;
        const ready=meleeNext().kind==='heavy';    // 강공 차례면 칼날이 금빛으로 달아오른다
        drawBladeShape(x,y,rest,BLADE_R0(),mw.range-6,1,ready,ready?HEAVY_RGB:null);

function drawShocks(){                                   // 쇠파이프 충격파 — 앞쪽으로 퍼지는 금빛 부채꼴 테

const BLADE_R0=()=>S.player.s*0.3;            // 칼 손잡이 시작 — 손 없이 몸에서 바로 나간다
function drawSwing(x,y){
  const sw=S.swing, p=S.player;
  const k=Math.min(1,sw.t/sw.dur), e=1-Math.pow(1-k,3);
  const a0=sw.ang-sw.arc/2*sw.dir, cur=a0+sw.arc*e*sw.dir;
  let curV=cur;                                       // 칼이 그려지는 각도 (판정과는 무관한 그림만의 움직임)
  if(OPT.mv.antic) curV-=sw.dir*(sw.heavy?0.6:0.42)*Math.max(0,1-k/0.18);          // 예비 동작 — 반대쪽으로 당겼다가
  if(OPT.mv.follow&&sw.t>sw.dur) curV+=sw.dir*(sw.heavy?0.34:0.24)*Math.sin(Math.min(1,(sw.t-sw.dur)/0.09)*Math.PI);   // 여운 — 지나쳤다 돌아온다
  const fade=sw.t>sw.dur?Math.max(0,1-(sw.t-sw.dur)/0.09):1;
  const tailK=Math.max(0,e-(sw.heavy?0.5:0.8)-(sw.t>sw.dur?(sw.t-sw.dur)/0.09*0.4:0));
  const ta=a0+sw.arc*tailK*sw.dir;
  const r0=p.s*0.45, r1=sw.range+8, ccw=sw.dir<0;
  const C=sw.heavy?HEAVY_RGB:sw.pipe?'225,228,232':CYAN_RGB;     // 쇠파이프는 에너지가 아니라 무채색 궤적
  if(Math.abs(cur-ta)>0.02){
    ctx.lineCap='butt';
    ctx.strokeStyle='rgba('+C+','+(0.22*fade).toFixed(3)+')'; ctx.lineWidth=r1-r0;
    ctx.beginPath(); ctx.arc(x,y,(r0+r1)/2,ta,cur,ccw); ctx.stroke();
    ctx.strokeStyle='rgba('+C+','+(0.35*fade).toFixed(3)+')'; ctx.lineWidth=(r1-r0)*0.45;
    ctx.beginPath(); ctx.arc(x,y,r1-(r1-r0)*0.25,ta,cur,ccw); ctx.stroke();
    ctx.strokeStyle='rgba('+C+','+(0.7*fade).toFixed(3)+')'; ctx.lineWidth=13;
    ctx.beginPath(); ctx.arc(x,y,r1-8,ta,cur,ccw); ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,'+fade.toFixed(3)+')'; ctx.lineWidth=5;
    ctx.beginPath(); ctx.arc(x,y,r1-6,ta,cur,ccw); ctx.stroke();
  }
  if(sw.blade){ drawBladeShape(x,y,curV,BLADE_R0(),sw.bladeLen,1,false,sw.heavy?HEAVY_RGB:null);
  }else if(sw.pipe) drawPipeShape(x,y,curV,BLADE_R0(),sw.range-10,sw.heavy?HEAVY_RGB:null);
}
function drawDrops(){
  for(const w of S.drops){
    if(w.kind==='gun') drawGunShape(w.x,w.y,w.rot,0,0,1);
    else if(w.kind==='pipe') drawPipeShape(w.x,w.y,w.rot,-20,ITEMS.pipe.range-10,null);
    else drawBladeShape(w.x,w.y,w.rot,-12,ITEMS.blade.range-6,w.glow,w.glow>0&&w.glow<1);

}

/* ===== 그리기 — 이펙트 ===== */
const HEAVY_RGB='255,190,60';
// 무기를 꺼내거나 넣을 때 — 원거리·근거리 발동 범위를 잠깐 보여준다 (회피 반격은 사거리가 없어 표시하지 않는다)
function drawRanges(){
  if(S.rangeT<=0||S.phase!=='play')return;
  const p=S.player, a=Math.min(1,S.rangeT/0.5), rw=rangedW(), mw=meleeW();
  const ring=(r,rgb,dash,label,w)=>{
    ctx.strokeStyle='rgba('+rgb+','+(0.75*a).toFixed(2)+')'; ctx.lineWidth=w;
    ctx.lineWidth=LINE_THIN;
    ctx.beginPath(); ctx.arc(p.x,p.y,r,0,TAU); ctx.stroke();
    ctx.font=fUI(15); ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.lineWidth=5; ctx.strokeStyle='rgba(255,255,255,'+(0.9*a).toFixed(2)+')';
    ctx.strokeText(label,p.x,p.y-r-1);
    ctx.fillStyle='rgba('+rgb+','+a.toFixed(2)+')'; ctx.fillText(label,p.x,p.y-r-1);
    ctx.textBaseline='alphabetic';
  };
  if(rw) ring(rw.range,'30,150,195',[8,6],t('ui.ranged')+' · '+rw.name,2);
  ring(mw.range,'60,72,86',[],t('ui.melee')+' · '+mw.name,2.4);

// 스파크는 온도 4단계로 묶어서 그린다: 흰빛 → 노랑 → 주황 → 식은 붉은빛
// 바깥은 진한 주황 테두리라 하얀 바닥에서도 또렷하다
/* ===== 폭발 그리기 — 그라데이션 없이 단색 덩어리를 겹친다 (게임의 면·선 그림체에 맞춘다) ===== */
// k: 0~1 진행. 뭉치마다 부풀기(d 이후) → 유지 → 흩어지기(o 이후 하나씩 쪼그라듦)
/* 폭발 색 — 게임 전체가 저채도라 폭발도 채도를 낮춘다 (밝기는 유지). 스파크는 예외로 선명하게 */
const FX={core:'#f6ecd9', mid:'#e3b56f', outer:'#d4875a', cool:'#b26a52', smoke:'#5f5b57', ring:'225,160,110'};
function lobeScale(l,k,grow,o0,o1){
  const g=Math.min(1,Math.max(0,(k-l.d)/grow)), up=1-Math.pow(1-g,3);
  const s0=o0+l.o*(o1-o0), sh=k<s0?1:Math.max(0,1-(k-s0)/(1-s0+0.0001)*1.25);
  return up*Math.pow(sh,0.8);
}
function lobesPath(b,R,dx,dy,k,grow,o0,o1,spread){
  ctx.beginPath();
  for(const l of b.lobes){
    const sc=lobeScale(l,k,grow,o0,o1); if(sc<=0.02)continue;
    const dr=1+(spread||0)*k;                       // 식으면서 뭉치들이 바깥으로 벌어진다
    const x=b.x+l.x*R*0.85*dr+dx, y=b.y+l.y*R*0.85*dr+dy, r=R*l.s*sc;
    ctx.moveTo(x+r,y); ctx.arc(x,y,r,0,TAU);
  }
}
/* 폭발 덩어리 — 바닥 바로 위 층. 그 위로 빨간 범위 · 로봇(쪼개지는 모션) · 잔해 · 스파크가 올라온다 */
function drawBooms(){
  // 연기 → 폭발 덩어리 → 불 순서로, 전부 바닥 층에
  for(const pt of S.parts){ if(pt.k!=='smoke')continue; const k=pt.t/pt.life; if(k>0.9)continue;
    ctx.globalAlpha=(1-k)*0.4; ctx.fillStyle=pt.c; ctx.beginPath(); ctx.arc(pt.x,pt.y,Math.min(46,pt.s*(1+k*1.6)),0,TAU); ctx.fill(); }
  ctx.globalAlpha=1;
  for(const b of S.booms){
    // 폭발 — ① 번쩍 ② 뭉치가 시간차로 부푼다 ③ 흰 심지 → 노랑 → 주황이 차례로 꺼진다 ④ 뒤에서 짙은 연기가 드러나 떠오르며 흩어진다
    const k=b.t/b.dur, R=b.r*0.72, rise=-k*b.r*0.5;
    // ④ 연기 (불덩이 뒤)
    if(k>0.16){ const kk=(k-0.16)/0.84;
      ctx.globalAlpha=0.5*(kk<0.7?1:1-(kk-0.7)/0.3); ctx.fillStyle=FX.smoke;
      lobesPath(b,R*1.12,0,rise-R*0.15,kk,0.25,0.35,0.9,0.5); ctx.fill(); }
    ctx.globalAlpha=0.86;                           // 바깥 겹은 살짝 비친다
    // ② ③ 불덩이 세 겹
    // 안쪽 겹은 가운데가 아니라 쏠린 쪽으로 — 동심원(꽃) 모양을 피한다
    const lx=Math.cos(b.lean)*R*0.18, ly=Math.sin(b.lean)*R*0.18;
    ctx.fillStyle=k<0.3?FX.outer:FX.cool; lobesPath(b,R,0,rise*0.4,k,0.16,0.3,0.62,0.35); ctx.fill(); ctx.globalAlpha=1;
    ctx.fillStyle=FX.mid; lobesPath(b,R*0.7,lx,rise*0.4+ly-R*0.06,k,0.13,0.18,0.42,0.3); ctx.fill();
    ctx.fillStyle=FX.core; lobesPath(b,R*0.4,lx*1.6,rise*0.4+ly*1.6-R*0.1,k,0.1,0.08,0.24,0.2); ctx.fill();
    // ① 번쩍 — 짧은 흰 원 하나
    if(k<0.08){ ctx.globalAlpha=1-k/0.08; ctx.fillStyle='#ffffff'; ctx.beginPath(); ctx.arc(b.x,b.y,b.r*(0.75+k*3),0,TAU); ctx.fill(); }
  }
  for(const pt of S.parts){ if(pt.k!=='fire')continue; const k=pt.t/pt.life; if(k>0.92)continue;
    ctx.globalAlpha=Math.max(0,1-k); ctx.fillStyle=k<0.25?FX.core:k<0.55?FX.mid:FX.cool;
    ctx.beginPath(); ctx.arc(pt.x,pt.y,pt.s*(1+k*0.7),0,TAU); ctx.fill(); }
  ctx.globalAlpha=1;
}
const SPARK_BIN=[[],[],[],[]];
// 스파크는 원래 모양(날아가는 방향으로 늘어진 불꽃 줄기) 그대로, 바깥 테두리만 없앴다
// 한 줄로만 그리니 하얀 바닥에서도 보이게 색을 진하게 잡았다
const SPARK_STYLE=[
  {c:'#ffd23a', w:2.4, glow:'rgba(255,170,40,0.26)', gw:7, hot:'rgba(255,255,240,0.95)', hw:1.0},   // 막 튄 불꽃 — 흰 심지 + 빛 번짐
  {c:'#ffa61a', w:2.1, glow:'rgba(255,140,30,0.18)', gw:6},
  {c:'#ff7414', w:1.8},
  {c:'rgba(205,85,30,0.7)', w:1.4}   // 식어 가는 불똥
];
function sparkPath(list){
  ctx.beginPath();
  for(const pt of list){
    const sx=pt.x, sy=pt.y-pt.z;
    const tl=0.02+0.016*Math.max(0,1-pt.t*3);       // 막 튄 불꽃은 꼬리가 더 길다
    const tx=sx-pt.vx*tl, ty=sy-(pt.vy-pt.vz)*tl;
    if(Math.abs(tx-sx)+Math.abs(ty-sy)<1.2){ ctx.moveTo(sx-0.7,sy); ctx.lineTo(sx+0.7,sy); }
    else{ ctx.moveTo(sx,sy); ctx.lineTo(tx,ty); }
  }
}
function drawSparkBins(){
  ctx.lineCap='round';
  for(let b=3;b>=0;b--){
    const L=SPARK_BIN[b]; if(!L.length)continue;
    const st=SPARK_STYLE[b];
    sparkPath(L);
    if(st.glow&&L.length<140){ ctx.strokeStyle=st.glow; ctx.lineWidth=st.gw; ctx.stroke(); }   // 불꽃이 아주 많을 땐 빛 번짐을 생략 (굵은 선 덧칠이 제일 비싸다)
    ctx.strokeStyle=st.c; ctx.lineWidth=st.w; ctx.stroke();
    if(st.hot){ ctx.strokeStyle=st.hot; ctx.lineWidth=st.hw; ctx.stroke(); }
    L.length=0;
  }
}
function drawJagged(x1,y1,x2,y2,segs,amp){
  const dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy)||1, nx=-dy/L, ny=dx/L;
  ctx.beginPath(); ctx.moveTo(x1,y1);
  for(let i=1;i<segs;i++){ const t=i/segs, o=(Math.random()-0.5)*amp;
    ctx.lineTo(x1+dx*t+nx*o,y1+dy*t+ny*o); }
  ctx.lineTo(x2,y2);
}
function drawGrenades(){
  for(const g of S.grenades){
    if(g.t<0)continue;
    const k=Math.min(1,g.t/g.dur);
    // 떨어질 자리 — 폭발 범위를 미리 보여준다
    ctx.strokeStyle='rgba('+CYAN_RGB+','+(0.25+k*0.5).toFixed(2)+')'; ctx.lineWidth=2;
    ctx.lineWidth=LINE_THIN;
    ctx.beginPath(); ctx.arc(g.x1,g.y1,g.rad,0,TAU); ctx.stroke();
    ctx.fillStyle='rgba('+CYAN_RGB+','+(0.06+k*0.1).toFixed(2)+')';
    ctx.beginPath(); ctx.arc(g.x1,g.y1,g.rad*k,0,TAU); ctx.fill();
    // 그림자
    const sh=Math.max(0.3,1-g.z/160);
    ctx.fillStyle='rgba(28,36,46,'+(0.22*sh).toFixed(2)+')';
    ctx.beginPath(); ctx.ellipse(g.x,g.y,7*sh,4*sh,0,0,TAU); ctx.fill();
    // 탄
    ctx.save(); ctx.translate(g.x,g.y-g.z); ctx.rotate(g.rot);
    ctx.fillStyle='#262c33'; ctx.strokeStyle='#0f1317'; ctx.lineWidth=1.4;
    rr(-7,-4.5,14,9,3.5); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#e0a32e'; ctx.fillRect(-2,-4.5,3,9);
    ctx.fillStyle=Math.floor(S.t*16)%2?'#ffffff':CYAN;
    ctx.beginPath(); ctx.arc(5,0,1.8,0,TAU); ctx.fill();
    ctx.restore();
  }
}
function drawStorms(){
  const p=S.player;
  for(const st of S.storms){
    const k=Math.min(1,st.t/st.dur), e=1-Math.pow(1-k,2), r=lerp(st.R0,st.R1,e), a0=st.rot+st.t*14*st.dir;
    const fade=1-k*k, ccw=st.dir<0;            // 끝까지 또렷하다가 마지막에 사라진다
    ctx.lineCap='round';
    // 바람 — 옅은 회오리 줄기
    for(let i=0;i<6;i++){
      const rr2=r*(0.55+i*0.09), aa=a0*0.8+i*1.1;
      ctx.strokeStyle='rgba(150,160,172,'+(0.22*fade).toFixed(3)+')'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(p.x,p.y,rr2,aa,aa+0.7*st.dir,ccw); ctx.stroke();
    }
    // 검기 — 네 갈래 초승달이 돌면서 퍼진다
    for(let i=0;i<4;i++){

    const k=c.t/c.dur, sw=Math.min(1,k/0.35), fade=k<0.35?1:1-(k-0.35)/0.65;

    ctx.beginPath(); ctx.moveTo(s.x-c*l/2,s.y-n*l/2); ctx.lineTo(s.x+c*l/2,s.y+n*l/2); ctx.stroke();

  }
  for(const r of S.rings){

    if(MOBILE){
      if(on&&mw.combo.length>1){ comboCells(26,142); }
    }else{
      // ── 왼쪽 아래 카드: 콤보 · 무기 상태 · 장착 무기
      let wx=26;
      if(on&&mw.combo.length>1) wx=26+comboCells(26,H-92)+16;
      ctx.textAlign='left'; ctx.font=fUI(15);
      ctx.fillStyle=on?'rgba(30,150,195,0.95)':ink+'0.55)';
      const wl=on?t('ui.weaponOn'):t('ui.weaponOff');
      hudText(wl,wx,H-74);
      const ww=ctx.measureText(wl).width;
      ctx.font=fUI(11); ctx.fillStyle=ink+'0.4)'; hudText('Q',wx+ww+8,H-74);
      if(!on){ ctx.font=fUI(12); ctx.fillStyle=ink+'0.5)'; hudText(t('ui.offHint'),wx+ww+24,H-74); }
      ctx.font=fUI(13); ctx.fillStyle=ink+'0.7)';
      if(S.tut&&!rw) hudText(mw.name,26,H-30);              // 1층 튜토리얼 — 근접 무기 하나뿐
      else{ hudText('1  '+(rw?rw.name:t('ui.none')),26,H-30);
      hudText('2  '+mw.name,170,H-30); }
    }
  }
  drawTopButtons();
  if(S.msgT>0&&S.msg){
    ctx.textAlign='center';
    const a=Math.min(1,S.msgT);
    ctx.fillStyle='rgba(34,42,53,'+(0.3+a*0.65).toFixed(2)+')';
    ctx.font=fBIG(38); ctx.lineJoin='round';
    ctx.lineWidth=7; ctx.strokeStyle='rgba(255,255,255,'+(0.3+a*0.6).toFixed(2)+')'; ctx.strokeText(S.msg,W/2,H*0.24);
    hudText(S.msg,W/2,H*0.24);
  }
  if(S.phase==='death'&&S.death.t>0.3&&!S.over&&Math.random()<0.8){
    ctx.textAlign='center'; ctx.font=fUI(16);
    ctx.fillStyle='rgba(230,60,50,0.8)';
    hudText(t('death.signal'),W/2+(Math.random()-0.5)*4,H*0.2);
  }
  if(OPT.fps) drawDevFps(H-118);
}
function drawDevFps(y){                          // 개발자용 — fps · 그림 해상도 (언어 공통)
  ctx.save(); ctx.textAlign='left'; ctx.textBaseline='alphabetic'; ctx.font=fUI(12); ctx.fillStyle='rgba(30,120,70,0.85)';
  hudText(FPS.v.toFixed(0)+' fps   low '+(FPS.lo<900?FPS.lo.toFixed(0):'-')
    +'   '+cv.width+'×'+cv.height+(RES.lv?' (auto -'+RES.lv+')':'')+'   floor x'+DEC_K
    +'   parts '+S.parts.length+'   enemies '+S.enemies.length
    +'   upd '+PROF.u.toFixed(1)+'ms   draw '+PROF.r.toFixed(1)+'ms',20,y);
  ctx.restore();
}
function drawOver(){
  const og=ctx.createRadialGradient(W/2,H*0.45,30,W/2,H*0.45,H*0.75);
  og.addColorStop(0,'rgba(10,12,16,0.15)'); og.addColorStop(0.5,'rgba(10,12,16,0.5)'); og.addColorStop(1,'rgba(10,12,16,0.82)');
  ctx.fillStyle=og; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle='#e4eaf0'; ctx.font=fBIG(50);
  ctx.fillText(S.cleared?t('clear.title'):t('over.title'),W/2,H*0.76);
  ctx.fillStyle='rgba(190,200,212,0.85)'; ctx.font=fUI(18);
  ctx.fillText(t('over.stats',{w:S.wv.n,k:S.kills,c:S.dodges}),W/2,H*0.76+36);
  ctx.fillStyle='rgba(170,180,192,0.8)'; ctx.font=fUI(19);
  ctx.fillText(MOBILE?t('over.retryMobile'):t('over.retryPC'),W/2,H*0.76+70);
}
const PRESS={};
function press(k){ PRESS[k]=performance.now(); }
function pressed(k){ return PRESS[k]?Math.max(0,1-(performance.now()-PRESS[k])/160):0; }
function drawTopButtons(){                        // 메뉴·인벤토리 — PC와 모바일 모두 버튼
  ctx.font=fUI(15);                               // 글자 길이에 맞춰 너비를 정한다 (언어마다 길이가 다르다)
  for(const b of [BTN_MENU,BTN_INV]){ b.label=t(b.lk); b.w=Math.max(84,ctx.measureText(b.label).width+(MOBILE?32:56)); }
  BTN_MENU.x=W-16-BTN_MENU.w; BTN_INV.x=BTN_MENU.x-8-BTN_INV.w;
  for(const [b,k] of [[BTN_INV,'i'],[BTN_MENU,'m']]){
    const pr=pressed(k);
    btnFrame(b.x,b.y,b.w,b.h);
    if(pr>0){ ctx.fillStyle='rgba(34,42,53,'+(pr*0.12).toFixed(2)+')'; rr(b.x,b.y,b.w,b.h,10); ctx.fill(); }
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font=fUI(15); ctx.fillStyle='rgba(34,42,53,0.9)';
    if(MOBILE) hudText(b.label,b.x+b.w/2,b.y+b.h/2+1);
    else{
      hudText(b.label,b.x+(b.w-24)/2,b.y+b.h/2+1);
      ctx.font=fUI(11); ctx.fillStyle='rgba(44,54,66,0.45)';
      hudText(b.key,b.x+b.w-18,b.y+b.h/2+1);
    }
    ctx.textBaseline='alphabetic';
  }
}
function drawTouchUI(){
  const p=S.player, ink='60,72,86';
  // 이동 패드 — 왼쪽에 고정
  const sx=STICK.cx, sy=STICK.cy;
  ctx.fillStyle='rgba('+ink+',0.07)'; ctx.beginPath(); ctx.arc(sx,sy,STICK.r,0,TAU); ctx.fill();
  ctx.strokeStyle='rgba('+ink+','+(stick.active?0.5:0.28)+')'; ctx.lineWidth=2.5;
  ctx.beginPath(); ctx.arc(sx,sy,STICK.r,0,TAU); haloStroke();
  let kx=sx,ky=sy;
  if(stick.active){
    const dx=stick.x-sx,dy=stick.y-sy,L=Math.hypot(dx,dy), m=Math.min(L,STICK.r-STICK.kr*0.5);
    if(L>0.001){ kx=sx+dx/L*m; ky=sy+dy/L*m; }
  }
  ctx.fillStyle='rgba('+ink+','+(stick.active?0.32:0.18)+')'; ctx.beginPath(); ctx.arc(kx,ky,STICK.kr,0,TAU); ctx.fill();
  ctx.strokeStyle='rgba('+ink+',0.45)'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(kx,ky,STICK.kr,0,TAU); haloStroke();
  // 회피 — 오른쪽 큰 원, 위에 남은 횟수
  const ready=p.dcharge>0, pr=pressed('d'), R=BTN_D.r*(1-pr*0.07);
  ctx.fillStyle='rgba(30,160,210,'+(ready?0.16+pr*0.25:0.05).toFixed(2)+')';
  ctx.beginPath(); ctx.arc(BTN_D.x,BTN_D.y,R,0,TAU); ctx.fill();
  ctx.strokeStyle='rgba(30,160,210,'+(ready?0.75:0.3)+')'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.arc(BTN_D.x,BTN_D.y,R,0,TAU); haloStroke();
  for(let i=0;i<p.dmax;i++){
    const a0=-Math.PI/2-0.42+i*0.3;
    ctx.strokeStyle=i<p.dcharge?'rgba(30,160,210,0.95)':'rgba(150,160,172,0.4)'; ctx.lineWidth=5; ctx.lineCap='round';
    ctx.beginPath(); ctx.arc(BTN_D.x,BTN_D.y,BTN_D.r+10,a0,a0+0.22); haloStroke();
  }
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font=fUI(20); ctx.fillStyle='rgba(20,110,150,'+(ready?0.95:0.4)+')';
  hudText(t('ui.dodge'),BTN_D.x,BTN_D.y+1);
  // 작은 버튼 — 상호작용 F, 무기 ON/OFF
  const small=(b,lab,rgb,on,k)=>{
    const q=pressed(k), r=b.r*(1-q*0.08);
    ctx.fillStyle='rgba('+rgb+','+(on?0.16+q*0.25:0.06).toFixed(2)+')';
    ctx.beginPath(); ctx.arc(b.x,b.y,r,0,TAU); ctx.fill();
    ctx.strokeStyle='rgba('+rgb+','+(on?0.7:0.3)+')'; ctx.lineWidth=2.2;
    ctx.beginPath(); ctx.arc(b.x,b.y,r,0,TAU); haloStroke();
    ctx.font=fUI(lab.length>2?12:17); ctx.fillStyle='rgba('+rgb+','+(on?0.95:0.5)+')';
    hudText(lab,b.x,b.y+1);
  };
  small(BTN_F,'F',ink,true,'f');
  small(BTN_Q,p.armed?t('ui.weaponOn'):t('ui.weaponOff'),p.armed?'30,150,195':ink,true,'q');
  ctx.textBaseline='alphabetic';
}
function drawRotateHint(){                        // 모바일 세로 화면이면 가로로 돌리라고 안내
  ctx.fillStyle='rgba(14,17,21,0.92)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center'; ctx.fillStyle='#e4eaf0'; ctx.font=fBIG(40);
  ctx.fillText(t('rotate.title'),W/2,H/2);
  ctx.font=fUI(18); ctx.fillStyle='rgba(190,200,212,0.8)';
  ctx.fillText(t('rotate.sub'),W/2,H/2+40);
}

/* ===== 루프 ===== */
fit();
let last=performance.now();
const PROF={u:0,r:0};          // 개발자 모드: 업데이트·그리기에 걸리는 시간(ms)
function loop(now){
  const raw=(now-last)/1000;
  const dt=Math.min(0.05,raw); last=now;
  FPS.t+=raw; FPS.n++;
  if(raw>0.0005) FPS.lo=Math.min(FPS.lo,1/raw);
  if(FPS.t>=0.5){ FPS.v=FPS.n/FPS.t; FPS.t=0; FPS.n=0; }
  if(!titleOn&&!menuOpen&&!invOpen&&!document.hidden) resWatch(Math.min(raw,0.25));   // 느리면 해상도를 저절로 낮춘다
  const t0=performance.now();
  if(!titleOn&&!menuOpen&&!invOpen&&!document.hidden&&!(window.CUTONLY&&!S.cut)) update(dt);   // 컷신 전용 파일은 컷신이 끝나면 멈춘다
  const t1=performance.now();
  if(!titleOn||FPS.n%30===0) render();             // 메인 화면에선 뒤 배경이 멈춰 있으니 가끔만 다시 그린다 (흐림 효과 부담 줄이기)
  const t2=performance.now();
  PROF.u=lerp(PROF.u,t1-t0,0.05); PROF.r=lerp(PROF.r,t2-t1,0.05);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
